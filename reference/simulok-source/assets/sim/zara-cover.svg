<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2438"/>
      <stop offset="55%" stop-color="#173347"/>
      <stop offset="100%" stop-color="#1d4a54"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0D9B8A" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7FE3D4" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- rail -->
  <line x1="60" y1="120" x2="740" y2="120" stroke="rgba(255,255,255,0.22)" stroke-width="3" stroke-linecap="round"/>

  <!-- hanging garments: grey on the left (the old estate), teal on the right (the shift) -->
  <g>
    <g fill="#9fb0bd" opacity="0.34">
      <path d="M92 120 l26 22 -12 118 h-28 l-12 -118 z"/>
      <path d="M162 120 l26 22 -12 142 h-28 l-12 -142 z"/>
      <path d="M232 120 l26 22 -12 104 h-28 l-12 -104 z"/>
      <path d="M302 120 l26 22 -12 134 h-28 l-12 -134 z"/>
    </g>
    <g fill="url(#teal)">
      <path d="M372 120 l26 22 -12 112 h-28 l-12 -112 z"/>
      <path d="M442 120 l26 22 -12 148 h-28 l-12 -148 z"/>
      <path d="M512 120 l26 22 -12 96 h-28 l-12 -96 z"/>
      <path d="M582 120 l26 22 -12 138 h-28 l-12 -138 z"/>
      <path d="M652 120 l26 22 -12 118 h-28 l-12 -118 z"/>
    </g>
  </g>

  <!-- hooks -->
  <g stroke="rgba(255,255,255,0.4)" stroke-width="2.5" fill="none">
    <path d="M92 120 v-14 a8 8 0 0 1 16 0"/>
    <path d="M162 120 v-14 a8 8 0 0 1 16 0"/>
    <path d="M232 120 v-14 a8 8 0 0 1 16 0"/>
    <path d="M302 120 v-14 a8 8 0 0 1 16 0"/>
    <path d="M372 120 v-14 a8 8 0 0 1 16 0"/>
    <path d="M442 120 v-14 a8 8 0 0 1 16 0"/>
    <path d="M512 120 v-14 a8 8 0 0 1 16 0"/>
    <path d="M582 120 v-14 a8 8 0 0 1 16 0"/>
    <path d="M652 120 v-14 a8 8 0 0 1 16 0"/>
  </g>

  <!-- the three forces, as a descending trend line under the rack -->
  <polyline points="70,400 190,382 310,392 430,352 550,336 670,296 740,282"
            fill="none" stroke="#7FE3D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <g fill="#7FE3D4">
    <circle cx="190" cy="382" r="5"/>
    <circle cx="430" cy="352" r="5"/>
    <circle cx="670" cy="296" r="5"/>
  </g>
  <line x1="60" y1="440" x2="740" y2="440" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <text x="60" y="60" font-family="Georgia, serif" font-size="34" fill="#ffffff">Zara</text>
  <text x="60" y="88" font-family="system-ui, sans-serif" font-size="16" fill="rgba(255,255,255,0.6)" letter-spacing="1.5">THE FAST-FASHION RECKONING</text>
  <text x="60" y="478" font-family="system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.45)">12 quarters · 4 segments · 5 rivals · one niche to carve</text>
</svg>
