<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1117"/>
      <stop offset="100%" stop-color="#1C2233"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%">
      <stop offset="0%" stop-color="#1A8A5C" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#1A8A5C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <rect width="600" height="340" fill="url(#glow)"/>
  <text x="300" y="65" text-anchor="middle" font-family="Georgia,serif" font-size="42" font-weight="700" fill="#E2DFD8">Bullwhip <tspan fill="#D97B2B">Effect</tspan></text>
  <text x="300" y="95" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-style="italic" fill="#6B6E78">TinyCare Supply Chain</text>
  <!-- 4-echelon supply chain diagram -->
  <g transform="translate(90,130)" fill="none" stroke-width="1.5" opacity="0.8">
    <rect x="0" y="0" width="80" height="45" rx="6" stroke="#1A8A5C"/>
    <text x="40" y="18" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#1A8A5C" stroke="none">RETAILER</text>
    <text x="40" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#E2DFD8" stroke="none" font-weight="700">±5%</text>
    <rect x="120" y="0" width="80" height="45" rx="6" stroke="#2980B9"/>
    <text x="160" y="18" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#2980B9" stroke="none">DISTRIBUTOR</text>
    <text x="160" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#E2DFD8" stroke="none" font-weight="700">±18%</text>
    <rect x="240" y="0" width="80" height="45" rx="6" stroke="#D97B2B"/>
    <text x="280" y="18" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#D97B2B" stroke="none">WHOLESALER</text>
    <text x="280" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#E2DFD8" stroke="none" font-weight="700">±35%</text>
    <rect x="360" y="0" width="80" height="45" rx="6" stroke="#C0392B"/>
    <text x="400" y="18" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#C0392B" stroke="none">FACTORY</text>
    <text x="400" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#E2DFD8" stroke="none" font-weight="700">±60%</text>
    <!-- arrows -->
    <line x1="82" y1="22" x2="118" y2="22" stroke="#4A5060" stroke-dasharray="4,3"/>
    <line x1="202" y1="22" x2="238" y2="22" stroke="#4A5060" stroke-dasharray="4,3"/>
    <line x1="322" y1="22" x2="358" y2="22" stroke="#4A5060" stroke-dasharray="4,3"/>
  </g>
  <!-- amplification wave -->
  <g transform="translate(90,210)" opacity="0.5">
    <polyline points="0,30 30,28 60,25 90,20 120,32 150,10 180,35 210,5 240,38 270,0 300,40 330,-5 360,42 390,-10 420,45" fill="none" stroke="#D97B2B" stroke-width="2"/>
    <line x1="0" y1="30" x2="420" y2="30" stroke="#4A5060" stroke-width="0.5" stroke-dasharray="2,4"/>
  </g>
  <text x="300" y="285" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#6B6E78">10 decisions · 4 echelons · 5 root causes</text>
  <text x="300" y="312" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1A8A5C" opacity="0.8">Krajewski Ch. 12 · Operations Management</text>
</svg>
