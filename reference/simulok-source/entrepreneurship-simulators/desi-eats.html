<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DesiEats — QSR Chain Builder</title>
</head>
<body>
<style>
:root{
  --saffron:#D97B2B;--saffron-light:#F5DFC4;--saffron-glow:rgba(217,123,43,0.12);
  --neem:#1A8A5C;--neem-light:#D0F0E0;
  --loss:#C0392B;--loss-light:#FADBD8;
  --ink:#1C2233;--ink-soft:#3A3F4E;
  --surface:#F4F1EB;--card:#FFFFFF;--card-border:#E4E0D8;
  --muted:#7E8490;--muted-light:#B8BCC6;
  --input-bg:#F9F7F3;--shadow:rgba(28,34,51,0.06);--shadow-md:rgba(28,34,51,0.10);
  --radius:10px;--radius-sm:6px;--radius-lg:16px;
  --blue:#2980B9;--purple:#8E44AD;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E8E4DC;--ink-soft:#B8BCC6;--surface:#121820;--card:#1A2030;
  --card-border:#2A3040;--muted:#7E8490;--muted-light:#4A5060;
  --input-bg:#1E2838;--shadow:rgba(0,0,0,0.2);--shadow-md:rgba(0,0,0,0.3);
  --saffron-light:#3A2810;--neem-light:#102820;--loss-light:#2A1515;
}}
[data-theme="dark"]{
  --ink:#E8E4DC;--ink-soft:#B8BCC6;--surface:#121820;--card:#1A2030;
  --card-border:#2A3040;--muted:#7E8490;--muted-light:#4A5060;
  --input-bg:#1E2838;--shadow:rgba(0,0,0,0.2);--shadow-md:rgba(0,0,0,0.3);
  --saffron-light:#3A2810;--neem-light:#102820;--loss-light:#2A1515;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--surface);color:var(--ink);line-height:1.5}
h1,h2,h3{font-family:Georgia,serif;font-weight:700}
#app{max-width:820px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.progress-strip{height:3px;background:var(--card-border);position:sticky;top:0;z-index:100}
.progress-strip-fill{height:100%;background:var(--saffron);transition:width 0.4s}
.game-header{position:sticky;top:3px;z-index:99;background:var(--card);border-bottom:1px solid var(--card-border);padding:8px 16px;display:flex;align-items:center;gap:12px;font-size:0.82rem;box-shadow:0 1px 4px var(--shadow)}
.brand{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--saffron);font-size:0.85rem;white-space:nowrap}
.brand svg{flex-shrink:0}
.step-badge{background:var(--saffron);color:#fff;padding:2px 10px;border-radius:20px;font-size:0.7rem;font-weight:700;letter-spacing:0.04em;white-space:nowrap}
.month-label{margin-left:auto;font-weight:600;font-size:0.82rem;white-space:nowrap}
.runway-badge{padding:2px 10px;border-radius:20px;font-size:0.7rem;font-weight:700;white-space:nowrap}
.runway-safe{background:var(--neem-light);color:var(--neem)}
.runway-warn{background:#FFF3CD;color:#856404}
.runway-danger{background:var(--loss-light);color:var(--loss);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
#main{flex:1;padding:16px}

/* Round Rail */
.round-rail{display:flex;justify-content:center;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.round-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;border:2px solid var(--card-border);color:var(--muted);background:var(--card);cursor:default;transition:all 0.2s}
.round-dot.done{background:var(--neem);color:#fff;border-color:var(--neem)}
.round-dot.current{background:var(--saffron);color:#fff;border-color:var(--saffron);transform:scale(1.15)}
.round-dot.shock{border-color:var(--loss)}
.round-dot.shock.current{background:var(--loss);border-color:var(--loss)}
.round-dot.funding{border-color:var(--blue)}
.round-dot.act-break{margin-left:12px}

/* Metric Strip */
.metric-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:16px}
.metric-pill{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:8px 10px;text-align:center}
.m-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:2px}
.m-value{font-family:ui-monospace,monospace;font-weight:700;font-size:0.9rem;font-variant-numeric:tabular-nums}
.m-delta{font-size:0.68rem;font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;margin-top:1px}
.m-delta.up{color:var(--neem)}.m-delta.down{color:var(--loss)}

/* Unit Economics Dashboard */
.unit-econ{background:var(--card);border:1.5px solid var(--saffron);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:16px}
.ue-header{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--saffron);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ue-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.ue-item{background:var(--input-bg);border-radius:var(--radius-sm);padding:8px 10px;text-align:center}
.ue-label{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em}
.ue-value{font-family:ui-monospace,monospace;font-weight:700;font-size:0.88rem;margin-top:2px}
.ue-value.good{color:var(--neem)}.ue-value.bad{color:var(--loss)}

/* Runway Bar */
.runway-section{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.rb-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;color:var(--muted);white-space:nowrap;min-width:55px}
.rb-track{flex:1;height:8px;background:var(--input-bg);border-radius:4px;overflow:hidden}
.rb-fill{height:100%;border-radius:4px;transition:width 0.5s,background 0.3s}
.rb-text{font-size:0.75rem;font-weight:600;white-space:nowrap;min-width:90px;text-align:right}

/* Season Badge */
.season-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:0.7rem;font-weight:600;background:var(--input-bg);border:1px solid var(--card-border);margin-bottom:12px}

/* Scene Cards */
.scene-card{background:var(--card);border:1.5px solid var(--card-border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:0 2px 12px var(--shadow);margin-bottom:16px}
.scene-header{padding:10px 16px;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:6px}
.scene-header.saffron{background:var(--saffron);color:#fff}
.scene-header.loss{background:var(--loss);color:#fff}
.scene-header.blue{background:var(--blue);color:#fff}
.scene-header.purple{background:var(--purple);color:#fff}
.scene-body{padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.scene-emoji-row{display:flex;gap:8px;font-size:2.2rem;line-height:1;flex-shrink:0}
.scene-text{flex:1;min-width:200px}
.st-title{font-family:Georgia,serif;font-weight:700;font-size:1.05rem;margin-bottom:6px}
.st-desc{font-size:0.85rem;color:var(--ink-soft);line-height:1.55}
.st-highlight{color:var(--saffron);font-weight:600}
.st-neem{color:var(--neem);font-weight:600}
.st-loss{color:var(--loss);font-weight:600}
.scene-stats{display:flex;gap:10px;flex-wrap:wrap;padding:0 20px 14px}
.scene-stat{background:var(--input-bg);border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:6px 10px;text-align:center;flex:1;min-width:70px}
.ss-val{font-family:ui-monospace,monospace;font-weight:700;font-size:0.85rem}
.ss-label{font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px}

/* Scenario Card */
.scenario-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:24px;margin-bottom:16px;box-shadow:0 1px 6px var(--shadow)}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px}
.tag-decision{background:var(--saffron-light);color:var(--saffron)}
.tag-shock{background:var(--loss-light);color:var(--loss)}
.tag-info{background:var(--neem-light);color:var(--neem)}
.tag-outcome{background:var(--saffron-light);color:var(--saffron)}
.tag-funding{background:rgba(41,128,185,0.12);color:var(--blue)}

/* Option Cards (MCQ) */
.decision-group{margin-top:20px}
.dg-label{font-weight:700;font-size:0.88rem;margin-bottom:10px;color:var(--ink)}
.option-cards{display:flex;flex-direction:column;gap:8px}
.option-card{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1.5px solid var(--card-border);border-radius:var(--radius);cursor:pointer;transition:all 0.15s;background:var(--card)}
.option-card:hover{border-color:var(--saffron);box-shadow:0 2px 8px var(--saffron-glow)}
.option-card.selected{border-color:var(--saffron);background:var(--saffron-glow);box-shadow:0 0 0 2px var(--saffron)}
.letter{width:28px;height:28px;border-radius:50%;background:var(--input-bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.78rem;flex-shrink:0;color:var(--muted)}
.option-card.selected .letter{background:var(--saffron);color:#fff}
.opt-content{flex:1}
.opt-title{font-weight:700;font-size:0.88rem}
.opt-desc{font-size:0.8rem;color:var(--muted);margin-top:2px;line-height:1.45}
.opt-tag{display:inline-block;font-size:0.68rem;font-weight:600;padding:1px 6px;border-radius:4px;margin-top:4px}
.opt-tag.good{background:var(--neem-light);color:var(--neem)}
.opt-tag.warn{background:#FFF3CD;color:#856404}
.opt-tag.bad{background:var(--loss-light);color:var(--loss)}

/* Lever/Slider Component */
.lever-group{background:var(--card);border:1.5px solid var(--card-border);border-radius:var(--radius);padding:16px;margin-top:14px}
.lever-label{font-weight:700;font-size:0.88rem;margin-bottom:4px}
.lever-display{font-family:ui-monospace,monospace;font-size:1.4rem;font-weight:700;color:var(--saffron);margin-bottom:8px;font-variant-numeric:tabular-nums}
.lever-track{width:100%;appearance:none;-webkit-appearance:none;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--neem) 0%,var(--saffron) 50%,var(--loss) 100%);outline:none;cursor:pointer}
.lever-track::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--saffron);border:3px solid #fff;box-shadow:0 2px 6px var(--shadow-md);cursor:grab}
.lever-track::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--saffron);border:3px solid #fff;box-shadow:0 2px 6px var(--shadow-md);cursor:grab}
.lever-range{display:flex;justify-content:space-between;font-size:0.7rem;color:var(--muted);margin-top:4px}
.lever-hint{font-size:0.78rem;color:var(--ink-soft);margin-top:8px;padding:8px 10px;background:var(--input-bg);border-radius:var(--radius-sm);min-height:36px;transition:all 0.2s}
.lever-hint .impact-tag{font-weight:600;font-size:0.7rem;padding:1px 6px;border-radius:4px;margin-right:4px}
.lever-hint .impact-tag.pos{background:var(--neem-light);color:var(--neem)}
.lever-hint .impact-tag.neg{background:var(--loss-light);color:var(--loss)}
.lever-hint .impact-tag.neutral{background:var(--saffron-light);color:var(--saffron)}

/* Reviews Panel */
.reviews-panel{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:16px}
.rp-header{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--loss);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.review-card{padding:10px 12px;background:var(--input-bg);border-radius:var(--radius-sm);margin-bottom:8px}
.review-card:last-child{margin-bottom:0}
.rc-stars{font-size:0.75rem;margin-bottom:3px;letter-spacing:2px}
.rc-text{font-size:0.82rem;font-style:italic;line-height:1.45;color:var(--ink-soft)}
.rc-author{font-size:0.7rem;color:var(--muted);margin-top:4px;text-align:right}

/* Insight Box */
.insight-box{background:var(--saffron-glow);border:1.5px solid var(--saffron);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
.ib-header{font-size:0.72rem;font-weight:700;text-transform:uppercase;color:var(--saffron);margin-bottom:6px}
.ib-text{font-size:0.85rem;line-height:1.55;color:var(--ink)}

/* Decision Journal */
.journal-box{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px 16px;margin-top:16px}
.jb-label{font-size:0.75rem;font-weight:700;color:var(--muted);margin-bottom:6px}
.jb-input{width:100%;min-height:60px;padding:10px;border:1px solid var(--card-border);border-radius:var(--radius-sm);background:var(--input-bg);color:var(--ink);font-family:system-ui;font-size:0.82rem;resize:vertical}
.jb-input:focus{outline:none;border-color:var(--saffron)}

/* Event Banner */
.event-banner{padding:12px 16px;border-radius:var(--radius);margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.event-banner.shock{background:var(--loss-light);border:1px solid var(--loss)}
.event-banner.season{background:var(--saffron-light);border:1px solid var(--saffron)}
.ev-icon{font-size:1.3rem;flex-shrink:0}
.ev-text{font-size:0.85rem;line-height:1.5}

/* Outcome Section */
.outcome-section{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:20px 24px;margin-bottom:16px}
.outcome-section.negative{border-color:var(--loss)}
.outcome-list{list-style:none;margin-top:12px}
.outcome-list li{padding:8px 0;border-bottom:1px solid var(--card-border);display:flex;align-items:flex-start;gap:8px;font-size:0.85rem}
.outcome-list li:last-child{border-bottom:none}
.ol-icon{flex-shrink:0;font-size:1rem}

/* Competitor Card */
.competitor-card{background:var(--loss-light);border:1.5px solid var(--loss);border-radius:var(--radius);padding:16px;margin-bottom:16px;font-size:0.85rem}
.competitor-card h4{color:var(--loss);margin-bottom:8px}

/* Cost Table */
.cost-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:0.82rem}
.cost-table th{text-align:left;padding:6px 0;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);border-bottom:1.5px solid var(--card-border)}
.cost-table td{padding:8px 0;border-bottom:1px solid var(--card-border)}
.cost-table td:last-child{text-align:right;font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums}
.cost-table tr.total td{font-weight:700;border-top:2px solid var(--ink);border-bottom:none}
.cost-table tr.gst td{color:var(--muted);font-size:0.78rem}

/* Buttons */
.btn{padding:10px 28px;border-radius:var(--radius);font-weight:700;font-size:0.88rem;border:none;cursor:pointer;transition:all 0.15s}
.btn-primary{background:var(--saffron);color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-secondary{background:var(--input-bg);color:var(--ink);border:1px solid var(--card-border)}
.nav-row{display:flex;justify-content:flex-end;gap:12px;margin-top:20px;margin-bottom:20px}

/* Intro Screen */
.intro-screen{text-align:center;padding:30px 20px}
.intro-screen h1{font-size:2.2rem;margin-bottom:4px;color:var(--saffron)}
.subtitle{color:var(--muted);font-style:italic;margin-bottom:24px}
.story{text-align:left;max-width:600px;margin:0 auto;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:24px;font-size:0.88rem;line-height:1.65;margin-bottom:24px}

/* Results Screen */
.results-screen{padding:20px 0}
.results-hero{text-align:center;padding:30px 20px;background:var(--card);border:1.5px solid var(--saffron);border-radius:var(--radius-lg);margin-bottom:20px}
.valuation-label{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted)}
.valuation-number{font-family:Georgia,serif;font-size:2.4rem;font-weight:700;color:var(--saffron);margin:8px 0}
.profile-title{font-family:Georgia,serif;font-size:1.1rem;font-weight:700;color:var(--ink)}
.profile-desc{font-size:0.88rem;color:var(--muted);margin-top:4px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);padding:14px;text-align:center}
.sc-label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted)}
.sc-value{font-family:ui-monospace,monospace;font-weight:700;font-size:1rem;margin-top:4px}
.review-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--input-bg);border:1px solid var(--card-border);border-radius:var(--radius-sm);cursor:pointer;font-size:0.82rem;font-weight:600;margin-bottom:4px;color:var(--ink)}
.review-toggle .arrow{transition:transform 0.2s}
.review-toggle.open .arrow{transform:rotate(90deg)}
.review-panel{max-height:0;overflow:hidden;transition:max-height 0.3s;padding:0 12px;font-size:0.8rem}
.review-panel.open{max-height:300px;padding:10px 12px;margin-bottom:8px}

/* Game Over */
.gameover-screen{text-align:center;padding:40px 20px}
.gameover-screen h1{color:var(--loss);font-size:2rem;margin-bottom:8px}

/* Scene VS card */
.scene-vs{display:flex;align-items:center;gap:12px;width:100%}
.scene-vs-card{background:var(--input-bg);border-radius:var(--radius-sm);padding:12px;text-align:center;border:1px solid var(--card-border)}
.scene-vs-badge{font-weight:900;font-size:1.1rem;color:var(--loss);flex-shrink:0}

/* Takeaway */
.takeaway-card{display:flex;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--card-border);font-size:0.85rem}
.tw-num{background:var(--saffron);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0;margin-right:10px;margin-top:2px}

@media(max-width:600px){
  .metric-strip{grid-template-columns:repeat(3,1fr)}
  .ue-grid{grid-template-columns:repeat(2,1fr)}
  .scene-body{flex-direction:column;align-items:flex-start}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}
</style>

<div id="app">
  <div class="progress-strip"><div class="progress-strip-fill" id="progressFill" style="width:0%"></div></div>
  <div class="game-header">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="var(--saffron)" stroke-width="2"/><path d="M8 12l3 3 5-6" stroke="var(--saffron)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>SimuLok</span>
    </div>
    <span style="color:var(--muted);font-size:0.78rem">DesiEats QSR Builder</span>
    <span class="step-badge" id="stepBadge">START</span>
    <span class="runway-badge runway-safe" id="runwayBadge" style="display:none">∞ runway</span>
    <div class="month-label" id="monthLabel">DesiEats</div>
  </div>
  <div id="main"></div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const $main=$('main'),$strip=$('progressFill'),$badge=$('stepBadge'),$rlabel=$('monthLabel'),$runway=$('runwayBadge');
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const rand=(lo,hi)=>lo+Math.random()*(hi-lo);
const fmt=v=>{v=Math.round(v);if(Math.abs(v)>=10000000)return'₹'+(v/10000000).toFixed(2)+'Cr';if(Math.abs(v)>=100000)return'₹'+(v/100000).toFixed(2)+'L';if(Math.abs(v)>=1000)return'₹'+(v/1000).toFixed(1)+'K';return'₹'+v;};
const fmtFull=v=>'₹'+Math.round(v).toLocaleString('en-IN');
const GST_RATE=5/105;
const TOTAL_ROUNDS=18;

/* ========== SEASONS ========== */
const SEASONS={
  1:{name:'January',mod:1.0,event:null,emoji:'❄️'},
  2:{name:'February',mod:1.0,event:null,emoji:'💐'},
  3:{name:'March',mod:1.05,event:'Holi season — street food demand rises',emoji:'🎨'},
  4:{name:'April',mod:0.92,event:'Exam season — college area footfall dips',emoji:'📚'},
  5:{name:'May',mod:0.88,event:'Summer heat — dine-in drops, delivery spikes',emoji:'☀️'},

/* ========== UTILITY ========== */
function setupCost(locKey){
  const L=LOCATIONS[locKey];
  return L.rent*L.deposit + L.equipment + L.interiors + L.licenses;
}

function calcUnitEconomics(){
  if(S.dailyCustomers<=0||S.monthlyRevenue<=0) return;
  const netRev=S.monthlyRevenue*(1-GST_RATE);
  const effectiveMargin=S.grossMargin+(S.hasCentralKitchen?0.08:0)-S.ingredientSpikeExtra;
  const cogsPerPlate=S.avgTicket*(1-effectiveMargin);
  S.costPerPlate=Math.round(cogsPerPlate+(S.locationRent*S.outlets+S.staffCount*S.avgSalary+S.marketingBudget+10000*S.outlets)/(S.dailyCustomers*30));
  S.contributionMargin=S.avgTicket-cogsPerPlate;
  const fixedCosts=S.locationRent*S.outlets+S.staffCount*S.avgSalary+S.marketingBudget+10000*S.outlets+S.monthlyEMI;
  S.breakEvenCustomers=S.contributionMargin>0?Math.ceil(fixedCosts/(S.contributionMargin*30)):999;
  const newCustomers=Math.max(1,Math.round(S.dailyCustomers*0.3));
  S.cac=S.marketingBudget>0?Math.round(S.marketingBudget/newCustomers):0;
  S.burnRate=S.monthlyProfit<0?Math.abs(S.monthlyProfit):0;
  S.runwayMonths=S.burnRate>0?Math.round(S.cash/S.burnRate):99;
}

function generateReviews(){
  const reviews=[];
  const cuisine=CUISINES[S.cuisine]?.name||'food';
  const ticket=S.avgTicket;
  const fill=(t)=>t.replace('{cuisine}',cuisine).replace('{ticket}',ticket).replace('{signature}','signature dish');

  if(S.rating>=4.0){
    const pool=REVIEW_DB.positive;
    reviews.push({...pool[Math.floor(rand(0,pool.length))],text:fill(pool[Math.floor(rand(0,pool.length))].text)});
    reviews.push({...pool[Math.floor(rand(0,pool.length))],text:fill(pool[Math.floor(rand(0,pool.length))].text)});
    if(Math.random()>0.5){const m=REVIEW_DB.mixed;reviews.push({...m[0],text:fill(m[0].text)});}
  } else if(S.rating>=3.0){
    const p=REVIEW_DB.positive,m=REVIEW_DB.mixed;
    reviews.push({...p[Math.floor(rand(0,p.length))],text:fill(p[Math.floor(rand(0,p.length))].text)});
    reviews.push({...m[Math.floor(rand(0,m.length))],text:fill(m[Math.floor(rand(0,m.length))].text)});
  } else {
    const m=REVIEW_DB.mixed,n=REVIEW_DB.negative;
    reviews.push({...n[Math.floor(rand(0,n.length))],text:fill(n[Math.floor(rand(0,n.length))].text)});
    reviews.push({...m[Math.floor(rand(0,m.length))],text:fill(m[Math.floor(rand(0,m.length))].text)});
  }
  // Contextual reviews
  if(S.ingredientSpikeExtra>0.1 && S.round>=8){
    const sr=REVIEW_DB.shrinkflation;reviews.push({...sr[0],text:fill(sr[0].text)});
  }
  if(S.competitorActive){
    const cr=REVIEW_DB.competitor;reviews.push({...cr[0],text:fill(cr[0].text)});
  }
  if(S.staffCrisisActive){
    const cc=REVIEW_DB.crisis;reviews.push({...cc[0],text:fill(cc[0].text)});
  }
  return reviews.slice(0,3);
}

function generateInsight(){
  const r=S.round;
  const loc=S.location,cui=S.cuisine,price=S.pricePoint,brand=S.brandStyle;
  const insights=[];

  // Location + cuisine + price synergy
  if(loc==='college'&&price==='premium') insights.push('Premium pricing in a college area is risky — students are price-sensitive. Your footfall multiplier (0.65x) is working against your high-traffic location. Consider if the margins justify the lower volume.');
  if(loc==='college'&&price==='budget'&&cui==='southindian') insights.push('South Indian + Budget + College Area is the classic unit economics play — high margin (65%) + high volume (1.3x elasticity) + low rent. This is how Udipi restaurants scaled across India.');
  if(loc==='foodcourt'&&cui==='burgers') insights.push('Burgers in a Food Court targets the mall\'s captive GenZ audience. Your rent is high (₹1.5L/mo) but footfall is guaranteed. Make sure your ticket size justifies that rent.');
  if(loc==='cloud'&&price==='premium') insights.push('Premium pricing in a cloud kitchen is bold — customers can\'t see your ambiance or experience your service. Your food has to do ALL the talking. Packaging becomes your storefront.');
  if(brand==='quirky'&&loc==='college') insights.push('Quirky branding + college area = natural fit. Memes and Instagram reels will spread organically in this demographic. Your brand score will compound faster here.');

  // Round-specific
  if(r===2&&S.hasSignatureDish) insights.push('Your signature dish is your moat. In QSR, one hero item drives 30-40% of revenue. Think McDonald\'s Big Mac or Haldiram\'s Chole Bhature — the item people come back for.');
  if(r===3&&S.trainingLevel>=2) insights.push('Professional training costs money now but compounds: trained staff = consistent quality = higher rating = more customers. This is the flywheel that built chains like Saravana Bhavan.');
  if(r===3&&S.payLevel===-1) insights.push('Below-market pay is a ticking time bomb. In Bengaluru\'s competitive job market, your staff will leave the moment QuickBite or any Zomato kitchen offers ₹2K more. The cost of turnover is 3-4x the salary difference.');
  if(r===5&&S.trainingLevel>=2) insights.push('Your training investment just paid off — FSSAI inspections are where shortcuts catch up with you. The restaurants that get shut down are almost always the ones that cut corners on staff training.');
  if(r===7&&S.outlets>1&&!S.hasSOPs) insights.push('You expanded without SOPs — this is the #1 reason restaurant chains fail in India. Without documented processes, quality in outlet #2 depends entirely on who\'s cooking that day.');
  if(r>=8&&S.hasContractFarming) insights.push('Contract farming is how major chains like McDonald\'s India stabilize costs. It takes 2 months to set up, but once active, you\'re insulated from market spikes.');

  // Financial health
  if(S.runwayMonths<6&&S.runwayMonths>0) insights.push('⚠️ Your runway is under 6 months. Every decision now is about survival, not growth. Cut costs or increase revenue — you can\'t do both at once. Pick the lever with faster impact.');
  if(S.monthlyProfit<0&&r>=3) insights.push('You\'re burning cash every month. In startup terms, your "burn rate" is '+fmt(Math.abs(S.monthlyProfit))+'/month. At this rate, you have '+S.runwayMonths+' months before the money runs out.');
  if(S.breakEvenCustomers>S.dailyCustomers&&r>=3) insights.push('You\'re below break-even ('+S.breakEvenCustomers+' customers/day needed, you have '+Math.round(S.dailyCustomers)+'). Every day you operate, you lose money. This isn\'t sustainable.');

  return insights[Math.floor(rand(0,insights.length))]||'Every decision in a QSR business compounds — good or bad. The choices you make today show up in next month\'s P&L.';
}

/* ========== RENDER HELPERS ========== */
function renderRoundRail(){
  const shockRounds=[5,6,8,9,10,11,15,17];
  const fundingRounds=[12,16];
  let h='<div class="round-rail">';
  for(let i=1;i<=TOTAL_ROUNDS;i++){
    let cls='round-dot';
    if(i<S.round) cls+=' done';
    else if(i===S.round) cls+=' current';
    if(shockRounds.includes(i)) cls+=' shock';
    if(fundingRounds.includes(i)) cls+=' funding';
    if(i===5||i===9||i===13) cls+=' act-break';
    h+=`<div class="${cls}">${i}</div>`;
  }
  h+='</div>';
  return h;
}

function renderMetrics(){
  const prev=S.prevMetrics||{};
  const metrics=[
    {label:'Cash',value:fmt(S.cash),raw:S.cash,prev:prev.cash},
    {label:'Revenue/mo',value:fmt(S.monthlyRevenue),raw:S.monthlyRevenue,prev:prev.monthlyRevenue},
    {label:'Profit/mo',value:fmt(S.monthlyProfit),raw:S.monthlyProfit,prev:prev.monthlyProfit},
    {label:'Rating',value:S.rating.toFixed(1)+'/5',raw:S.rating,prev:prev.rating},
    {label:'Customers/day',value:Math.round(S.dailyCustomers).toString(),raw:S.dailyCustomers,prev:prev.dailyCustomers},
    {label:'Outlets',value:S.totalOutlets.toString(),raw:S.totalOutlets,prev:prev.totalOutlets},
    {label:'Morale',value:S.staffMorale+'/100',raw:S.staffMorale,prev:prev.staffMorale},
    {label:'Brand',value:S.brandScore+'/100',raw:S.brandScore,prev:prev.brandScore},
  ];
  let h='<div class="metric-strip">';
  for(const m of metrics){
    let delta='';
    if(m.prev!==undefined&&S.round>1){
      const d=m.raw-m.prev;
      if(Math.abs(d)>0.01){
        const cls=d>0?'up':'down';
        const arrow=d>0?'▲':'▼';
        let dv='';
        if(['Cash','Revenue/mo','Profit/mo'].includes(m.label)) dv=fmt(Math.abs(d));
        else dv=Math.abs(d).toFixed(m.label==='Rating'?1:0);
        delta=`<div class="m-delta ${cls}">${arrow} ${dv}</div>`;
      }
    }
    h+=`<div class="metric-pill"><div class="m-label">${m.label}</div><div class="m-value">${m.value}</div>${delta}</div>`;
  }
  h+='</div>';
  return h;
}

function renderUnitEconomics(){
  if(S.round<2) return '';
  calcUnitEconomics();
  let h='<div class="unit-econ"><div class="ue-header">📊 Unit Economics</div><div class="ue-grid">';
  const items=[
    {label:'Cost/Plate',value:'₹'+S.costPerPlate,cls:S.costPerPlate>S.avgTicket?'bad':'good'},
    {label:'Contribution Margin',value:'₹'+Math.round(S.contributionMargin)+' ('+Math.round(S.contributionMargin/S.avgTicket*100)+'%)',cls:S.contributionMargin>0?'good':'bad'},
    {label:'Break-even/day',value:S.breakEvenCustomers+' customers',cls:S.breakEvenCustomers<=S.dailyCustomers?'good':'bad'},
    {label:'CAC',value:S.cac>0?'₹'+S.cac:'N/A',cls:S.cac<S.avgTicket?'good':'bad'},
    {label:'Monthly Burn',value:S.burnRate>0?fmt(S.burnRate):'Profitable ✓',cls:S.burnRate>0?'bad':'good'},
    {label:'Runway',value:S.burnRate>0?S.runwayMonths+' months':'∞',cls:S.runwayMonths>12?'good':S.runwayMonths>6?'':'bad'},
  ];
  for(const it of items) h+=`<div class="ue-item"><div class="ue-label">${it.label}</div><div class="ue-value ${it.cls}">${it.value}</div></div>`;
  h+='</div></div>';

  // Runway bar
  const pct=S.burnRate>0?clamp(S.runwayMonths/24*100,0,100):100;
  const rCls=S.runwayMonths>12?'var(--neem)':S.runwayMonths>6?'#F39C12':'var(--loss)';

  return h;
}

function leverHTML(lev){
  const fmtV=lev.format==='currency'?fmtFull(lev.default):lev.format==='percent'?(lev.default+'%'):lev.default;
  const minLabel=lev.format==='currency'?fmt(lev.min):lev.format==='percent'?(lev.min+'%'):lev.min;
  const maxLabel=lev.format==='currency'?fmt(lev.max):lev.format==='percent'?(lev.max+'%'):lev.max;
  const hintText=getHintForValue(lev,lev.default);
  return `<div class="lever-group" data-lever-id="${lev.id}">
    <div class="lever-label">${lev.label}</div>
    <div class="lever-display" id="lever_val_${lev.id}">${fmtV}</div>
    <input type="range" class="lever-track" id="lever_${lev.id}" min="${lev.min}" max="${lev.max}" step="${lev.step}" value="${lev.default}" oninput="window.updateLever('${lev.id}',this.value,'${lev.format}')">
    <div class="lever-range"><span>${minLabel}</span><span>${maxLabel}</span></div>
    <div class="lever-hint" id="lever_hint_${lev.id}">${hintText}</div>
  </div>`;
}

function getHintForValue(lev,val){
  val=Number(val);
  if(!lev.hints||!lev.hints.length) return '';
  let best=lev.hints[0];
  for(const h of lev.hints){if(val>=h.at) best=h;}
  return best.text;
}

/* ========== SELECTION & LEVER LOGIC ========== */
window.selectOption=function(el){
  const group=el.dataset.group;
  document.querySelectorAll(`.option-card[data-group="${group}"]`).forEach(c=>c.classList.remove('selected'));
  el.classList.add('selected');
  checkSubmit();
};

window.updateLever=function(id,val,format){
  val=Number(val);
  const display=$('lever_val_'+id);
  if(format==='currency') display.textContent=fmtFull(val);
  else if(format==='percent') display.textContent=val+'%';
  else display.textContent=val;

  // Find lever config and update hint
  const rd=ROUNDS[S.round];
  const levers=[...(rd.levers||[])];
  const lev=levers.find(l=>l.id===id);
  if(lev){
    const hint=$('lever_hint_'+id);
    if(hint) hint.textContent=getHintForValue(lev,val);
  }
  checkSubmit();
};

function checkSubmit(){
  const rd=ROUNDS[S.round];
  const mcqNeeded=(rd.decisions||[]).length;
  let mcqDone=0;
  for(let i=0;i<mcqNeeded;i++){
    if(document.querySelector(`.option-card.selected[data-group="${i}"]`)) mcqDone++;
  }
  const btn=document.getElementById('submitBtn');
  if(btn) btn.disabled=mcqDone<mcqNeeded;
}

function getDecision(groupIdx){
  const el=document.querySelector(`.option-card.selected[data-group="${groupIdx}"]`);
  return el?el.dataset.id:null;
}

function getLever(id){
  const el=$('lever_'+id);
  return el?Number(el.value):0;
}

/* ========== SIMULATION ENGINE ========== */
function saveMetrics(){
  S.prevMetrics={
    cash:S.cash,monthlyRevenue:S.monthlyRevenue,monthlyProfit:S.monthlyProfit,
    rating:S.rating,dailyCustomers:S.dailyCustomers,totalOutlets:S.totalOutlets,
    staffMorale:S.staffMorale,brandScore:S.brandScore,
  };
}

function simulateMonth(){
  const season=SEASONS[S.round]||{mod:1.0};

  const locationFactor=S.location==='cloud'?0:S.locationFactor;
  const priceElasticity=PRICES[S.pricePoint]?.elasticity||1.0;
  const ratingFactor=Math.max(S.rating/3.0,0.3);
  const brandFactor=1+S.brandScore/200;
  let viralMult=1;
  if(S.viralMonthsLeft>0){viralMult=1+S.viralBoost;S.viralMonthsLeft--;}
  let slowdownMult=S.economicSlowdown?1-S.slowdownFootfallPenalty:1;
  let compMult=1;
  if(S.competitorActive){compMult=1-S.competitorPenalty;S.competitorPenalty=Math.max(0,S.competitorPenalty-0.03);if(S.competitorPenalty<=0)S.competitorActive=false;}
  let crisisMult=S.staffCrisisActive?0.8:1;
  if(S.staffCrisisActive) S.staffCrisisActive=false;

  let rawDaily;
  if(S.location==='cloud'){
    rawDaily=80*S.marketingMult*ratingFactor*priceElasticity*brandFactor*viralMult*slowdownMult*compMult*crisisMult*season.mod*rand(0.9,1.1)+S.deliveryOrders;
  } else {
    rawDaily=S.baseFootfall*locationFactor*S.marketingMult*ratingFactor*priceElasticity*brandFactor*viralMult*slowdownMult*compMult*crisisMult*S.comboVolumeMult*season.mod*rand(0.9,1.1)+S.deliveryOrders;
  }

  const cappedDaily=Math.min(rawDaily,S.staffCapacity*S.outlets);
  const overworked=rawDaily>S.staffCapacity*S.outlets;
  S.dailyCustomers=Math.max(0,Math.round(S.location==='cloud'?rawDaily:cappedDaily));

  // Revenue (GST inclusive — customer pays this)
  let effectiveTicket=S.avgTicket;
  if(S.comboDiscount>0) effectiveTicket*=(1-S.comboDiscount*0.4);

  const dineInCustomers=Math.max(0,S.dailyCustomers-S.deliveryOrders);
  const dineInRevenue=dineInCustomers*effectiveTicket*30;
  const deliveryRevenue=S.deliveryOrders*effectiveTicket*(1-S.deliveryCommission)*30;
  const grossRevenue=dineInRevenue+deliveryRevenue;

  // GST
  S.gstPaid=Math.round(grossRevenue*GST_RATE);
  S.totalGST+=S.gstPaid;
  S.monthlyRevenue=grossRevenue-S.gstPaid; // net of GST

  // Tiffin service
  if(S.hasTiffin) S.monthlyRevenue+=30000;

  // COGS
  let effectiveMargin=S.grossMargin+(S.hasCentralKitchen?0.08:0)-S.ingredientSpikeExtra;
  const cogs=S.monthlyRevenue*(1-effectiveMargin);

  // Fixed costs
  const rent=S.locationRent*S.outlets;
  const staffCost=S.staffCount*S.avgSalary;
  const marketing=S.marketingBudget;
  const otherCosts=10000*S.outlets;
  const emi=S.monthlyEMI;

  S.monthlyProfit=S.monthlyRevenue-cogs-rent-staffCost-marketing-otherCosts-emi;
  S.cash+=S.monthlyProfit;

  if(overworked) S.staffMorale=clamp(S.staffMorale-5,0,100);

  S.totalRevenue+=S.monthlyRevenue;
  S.totalProfit+=S.monthlyProfit;
  if(S.monthlyRevenue>S.peakRevenue) S.peakRevenue=S.monthlyRevenue;
}

function buildPL(){
  const effectiveMargin=S.grossMargin+(S.hasCentralKitchen?0.08:0)-S.ingredientSpikeExtra;
  const cogs=S.monthlyRevenue*(1-effectiveMargin);
  const rent=S.locationRent*S.outlets;
  const staff=S.staffCount*S.avgSalary;
  const mkt=S.marketingBudget;
  const other=10000*S.outlets;
  const rows=[
    {label:'Gross Revenue',value:'+'+fmt(S.monthlyRevenue+S.gstPaid)},
    {label:'GST (5%)',value:'-'+fmt(S.gstPaid),negative:true,gst:true},
    {label:'Net Revenue',value:fmt(S.monthlyRevenue),total:true},
    {label:'COGS ('+Math.round((1-effectiveMargin)*100)+'%)',value:'-'+fmt(Math.abs(cogs)),negative:true},
    {label:'Rent ('+S.outlets+' outlet'+(S.outlets>1?'s':'')+')',value:'-'+fmt(rent),negative:true},
    {label:'Staff ('+S.staffCount+')',value:'-'+fmt(staff),negative:true},
    {label:'Marketing',value:'-'+fmt(mkt),negative:true},
    {label:'Other',value:'-'+fmt(other),negative:true},
  ];
  if(S.monthlyEMI>0) rows.push({label:'Loan EMI',value:'-'+fmt(S.monthlyEMI),negative:true});
  rows.push({label:'Monthly Profit',value:(S.monthlyProfit>=0?'+':'')+fmt(S.monthlyProfit),negative:S.monthlyProfit<0,total:true});
  rows.push({label:'Cash Balance',value:fmtFull(S.cash),total:true});
  return rows;
}

/* ========== ROUND PROCESSORS ========== */
function processRound1(){
  const loc=getDecision(0),cuisine=getDecision(1),price=getDecision(2),brand=getDecision(3),funding=getDecision(4);

  S.location=loc;S.cuisine=cuisine;S.pricePoint=price;S.brandStyle=brand;S.fundingType=funding;

  const L=LOCATIONS[loc];
  S.locationRent=L.rent;S.baseFootfall=L.footfall;S.locationFactor=L.factor;
  S.grossMargin=CUISINES[cuisine].margin;
  S.avgTicket=PRICES[price].ticket;
  S.brandScore=brand==='quirky'?12:brand==='modern'?8:5;
  S.rating=3.0;

  // Funding
  if(funding==='family'){S.cash+=1000000;S.loanAmount=1000000;S.loanRate=0;S.monthlyEMI=0;}
  else if(funding==='bank'){S.cash+=1500000;S.loanAmount=1500000;S.loanRate=0.12;S.monthlyEMI=Math.round(1500000*0.12/12);}
  else if(funding==='angel'){S.cash+=2000000;S.equityGiven=15;}

  // Setup
  const setup=setupCost(loc);
  if(S.cash<setup){
    S.cash-=setup; // Will go negative — bankruptcy check later
  } else {
    S.cash-=setup;
  }

  S.staffCount=4;S.staffCapacity=200;

  // Soft opening (50%)
  S.dailyCustomers=Math.round((S.location==='cloud'?30:S.baseFootfall*S.locationFactor*0.5)*rand(0.85,1.0));
  const effectiveTicket=S.avgTicket;
  const grossRev=S.dailyCustomers*effectiveTicket*30;
  S.gstPaid=Math.round(grossRev*GST_RATE);
  S.monthlyRevenue=grossRev-S.gstPaid;
  const cogs=S.monthlyRevenue*(1-S.grossMargin);
  S.monthlyProfit=S.monthlyRevenue-cogs-S.locationRent-S.staffCount*15000-10000-S.monthlyEMI;
  S.cash+=S.monthlyProfit;
  S.totalRevenue+=S.monthlyRevenue;S.totalProfit+=S.monthlyProfit;
  if(S.monthlyRevenue>S.peakRevenue) S.peakRevenue=S.monthlyRevenue;

  S.decisions[1]=`Location: ${L.name}, Cuisine: ${CUISINES[cuisine].name}, Price: ${PRICES[price].name}, Funding: ${funding}`;

  return {
    title:'Month 1 — Grand Opening',
    items:[
      {text:`Location: ${L.name} — Rent ${fmt(S.locationRent)}/mo, Setup: ${fmt(setup)}`,neutral:true},
      {text:`Cuisine: ${CUISINES[cuisine].name} — ${Math.round(S.grossMargin*100)}% gross margin`,neutral:true},
      {text:`Price: ${PRICES[price].name} — Avg ticket ₹${S.avgTicket}`,neutral:true},
      {text:`Funding: ${funding==='bootstrap'?'Bootstrap (₹15L only)':funding==='family'?'Family loan +₹10L (0% interest)':funding==='bank'?'Bank loan +₹15L (EMI: '+fmt(S.monthlyEMI)+'/mo)':'Angel +₹20L (gave 15% equity)'}`,neutral:true},
      {text:`Soft opening: ${S.dailyCustomers} customers/day`,positive:S.dailyCustomers>50},
      {text:`First month revenue: ${fmt(S.monthlyRevenue)} (after 5% GST)`,positive:S.monthlyRevenue>0},
      S.cash<0?{text:`⚠️ Cash is negative! You overspent on setup. Find revenue fast.`,positive:false}:null,
    ].filter(Boolean),
    breakdown:buildPL()
  };
}

function processRound2(){
  const menuSize=getLever('menu_size');
  const rdBudget=getLever('rd_budget');
  const comboDisc=getLever('combo_discount');

  // Menu quality based on size
  if(menuSize<=7) S.menuQuality=0.3;
  else if(menuSize>=15) S.menuQuality=-0.2;
  else S.menuQuality=0.1;

  // Signature dish based on R&D
  S.hasSignatureDish=rdBudget>=30000;
  S.cash-=rdBudget;
  const ratingBoost=rdBudget>=60000?0.3:rdBudget>=30000?0.2:rdBudget>=10000?0.1:0;

  // Combo
  S.comboDiscount=comboDisc/100;
  S.comboVolumeMult=1+comboDisc/100*0.8;

  S.rating=clamp(S.rating+S.menuQuality+ratingBoost,1,5);

  // Variety appeal
  if(menuSize>=12) S.marketingMult*=1.12;
  else if(menuSize>=8) S.marketingMult*=1.05;

  simulateMonth();
  S.decisions[2]=`Menu: ${menuSize} items, R&D: ${fmt(rdBudget)}, Combo: ${comboDisc}%`;

  return {
    title:'Month 2 — Menu Takes Shape',
    items:[
      {text:`Menu: ${menuSize} items ${menuSize<=7?'— Focused! Quality boost +0.3':menuSize>=15?'— Extensive! Harder to maintain quality (-0.2)':'— Standard range'}`,positive:S.menuQuality>=0},
      {text:`R&D Investment: ${fmt(rdBudget)}${ratingBoost>=0.2?' — Signature dish developed! Rating +'+ratingBoost:ratingBoost>0?' — Menu improved. Rating +'+ratingBoost:' — No R&D investment'}`,positive:ratingBoost>0},
      {text:`Combo discount: ${comboDisc}%${comboDisc>0?' — Volume boost +'+Math.round((S.comboVolumeMult-1)*100)+'%':' — No combos'}`,neutral:true},
      {text:`Rating: ${S.rating.toFixed(1)}/5 | Customers: ${Math.round(S.dailyCustomers)}/day`,positive:S.rating>=3.5},
    ],
    breakdown:buildPL()
  };
}

function processRound3(){
  const staffType=getDecision(0);
  const salary=getLever('salary');
  const training=getLever('training_budget');

  if(staffType==='lean'){S.staffCount=3;S.staffCapacity=150;}
  else if(staffType==='full'){S.staffCount=8;S.staffCapacity=400;}
  else{S.staffCount=5;S.staffCapacity=250;}

  S.avgSalary=salary;
  if(salary<14000){S.staffMorale=clamp(S.staffMorale-15,0,100);S.payLevel=-1;}
  else if(salary>20000){S.staffMorale=clamp(S.staffMorale+10,0,100);S.rating=clamp(S.rating+0.1,1,5);S.payLevel=1;}
  else{S.payLevel=0;}

  S.trainingLevel=training>=60000?3:training>=25000?2:training>=5000?1:0;
  S.cash-=training;
  if(S.trainingLevel>=2){S.staffMorale=clamp(S.staffMorale+15,0,100);S.rating=clamp(S.rating+0.2,1,5);}
  else if(S.trainingLevel>=1){S.staffMorale=clamp(S.staffMorale+5,0,100);}

  simulateMonth();
  S.decisions[3]=`Staff: ${staffType} (${S.staffCount}), Salary: ${fmt(salary)}, Training: ${fmt(training)}`;

  return {
    title:'Month 3 — Team Assembled',
    items:[
      {text:`Team: ${S.staffCount} people, capacity ${S.staffCapacity} customers/day`,neutral:true},
      {text:`Salary: ${fmt(salary)}/person${S.payLevel===-1?' — Below market! Risky for retention':S.payLevel===1?' — Above market. Team is motivated':''}`,positive:S.payLevel>=0},
      {text:`Training: ${fmt(training)} (Level ${S.trainingLevel})${S.trainingLevel>=2?' — Professional training! Quality +0.2':''}`,positive:S.trainingLevel>=2},
      {text:`Morale: ${S.staffMorale}/100 | Rating: ${S.rating.toFixed(1)}/5`,positive:S.staffMorale>=70},
    ],
    breakdown:buildPL()
  };
}

function processRound4(){
  const mktBudget=getLever('mkt_budget');
  const launchDiscount=getLever('launch_discount');
  const delivery=getDecision(0);

  S.marketingBudget=mktBudget;
  S.cash-=mktBudget;
  if(mktBudget>=150000){S.brandScore=clamp(S.brandScore+25,0,100);S.marketingMult*=1.20;}
  else if(mktBudget>=80000){S.brandScore=clamp(S.brandScore+15,0,100);S.marketingMult*=1.15;}
  else if(mktBudget>=40000){S.brandScore=clamp(S.brandScore+10,0,100);S.marketingMult*=1.10;}
  else{S.brandScore=clamp(S.brandScore+3,0,100);S.marketingMult*=1.05;}

  const launchBoost=launchDiscount/100*1.5;
  if(launchDiscount>20) S.rating=clamp(S.rating-0.1,1,5);

  if(delivery==='zomato'){S.deliveryOrders=30;S.deliveryCommission=0.25;}
  else if(delivery==='swiggy'){S.deliveryOrders=30;S.deliveryCommission=0.22;}
  else if(delivery==='both'){S.deliveryOrders=60;S.deliveryCommission=0.235;}
  else{S.deliveryOrders=0;S.deliveryCommission=0;}

  const oldMult=S.marketingMult;
  S.marketingMult*=(1+launchBoost);
  simulateMonth();
  S.marketingMult=oldMult;
  S.marketingBudget=Math.round(mktBudget*0.5);

  S.decisions[4]=`Marketing: ${fmt(mktBudget)}, Discount: ${launchDiscount}%, Delivery: ${delivery}`;

  return {
    title:'Month 4 — The Launch',
    items:[
      {text:`Marketing: ${fmt(mktBudget)} — Brand +${mktBudget>=150000?25:mktBudget>=80000?15:mktBudget>=40000?10:3}`,positive:true},
      {text:`Launch discount: ${launchDiscount}%${launchDiscount>0?' — '+Math.round(launchBoost*100)+'% temporary footfall boost':''}${launchDiscount>20?' (but too aggressive — rating -0.1)':''}`,positive:launchDiscount>0&&launchDiscount<=20},
      {text:`Delivery: ${delivery==='both'?'Zomato + Swiggy — +60 orders/day':delivery==='none'?'No delivery':'Single platform — +30 orders/day'}`,positive:delivery!=='none'},
      {text:`CAC: ₹${S.cac>0?S.cac:'N/A'} | Brand: ${S.brandScore}/100`,neutral:true},
    ],
    breakdown:buildPL()
  };
}

function processRound5(){
  const hygieneScore=50+(S.trainingLevel*15)+(S.staffCount>=5?10:0)+(S.menuQuality>=0?5:0)+(S.hygieneUpgrade?15:0);
  const response=getDecision(0);

  if(hygieneScore>80){S.rating=clamp(S.rating+0.3,1,5);S.brandScore=clamp(S.brandScore+10,0,100);}
  else if(hygieneScore>=60){S.cash-=50000;}
  else{S.rating=clamp(S.rating-0.5,1,5);S.brandScore=clamp(S.brandScore-15,0,100);S.marketingMult*=0.75;}

  if(response==='upgrade'){S.cash-=200000;S.hygieneUpgrade=true;S.rating=clamp(S.rating+0.2,1,5);}
  else if(response==='consultant'){S.cash-=40000;S.rating=clamp(S.rating+0.1,1,5);}

  simulateMonth();
  if(hygieneScore<60) S.marketingMult/=0.75;

  S.decisions[5]=`Hygiene: ${hygieneScore}/100, Response: ${response}`;
  const items=[];
  if(hygieneScore>80) items.push({text:`Hygiene: ${hygieneScore}/100 — Passed! Rating +0.3, Brand +10`,positive:true});
  else if(hygieneScore>=60) items.push({text:`Hygiene: ${hygieneScore}/100 — Minor violations. Fine: ₹50K`,positive:false});
  else items.push({text:`Hygiene: ${hygieneScore}/100 — Major violations! Shut down 1 week. Rating -0.5`,positive:false});

  if(response==='upgrade') items.push({text:'Full kitchen upgrade (₹2L) — Rating +0.2, future-proofed',positive:true});
  else if(response==='consultant') items.push({text:'Hygiene consultant (₹40K) — Rating +0.1',positive:true});
  else if(response==='minimum') items.push({text:'Minimum compliance. Cheap but risky.',neutral:true});
  else items.push({text:'Ignored. Next inspection will be worse.',positive:false});

  return {title:'Month 5 — FSSAI Inspection',items,breakdown:buildPL()};
}

function processRound9(){
  // Dynamic based on rating

    S.viralBoost=-0.30;S.viralMonthsLeft=2;S.brandScore=clamp(S.brandScore-25,0,100);
    ROUNDS[9].decisions=[{id:'viral',label:'Damage Control',options:[
      {id:'apologize',letter:'A',title:'Public Apology + Free Meals (₹20K)',desc:'Take responsibility. Show you care.'},
      {id:'ignore',letter:'B',title:'Ignore It',desc:'Hope it blows over. Risky.'},
      {id:'legal',letter:'C',title:'Threaten Legal Action',desc:'TERRIBLE idea. The internet does not forgive.',tag:{text:'⚠️ High Risk',cls:'bad'}},
    ]}];

function processRound11(){

  else if(pivot==='corporate') S.monthlyRevenue+=40000;

      {text:`Cost cutting: ${costs==='layoff'?'Laid off 2 — saves money, tanks morale':costs==='cutmarketing'?'Cut marketing 50%':costs==='renegotiaterent'?'Rent renegotiation attempted':'No cuts'}`,neutral:true},
      {text:`Pivot: ${pivot==='tiffin'?'Tiffin service launched — +₹30K/mo stable':pivot==='corporate'?'Corporate orders — high value':'No pivot'}`,positive:pivot!=='nochange'},
    ],
    breakdown:buildPL()
  };
}

function processRound12(){
  // EBITDA-based valuation
  const monthlyEBITDA=S.monthlyProfit+S.monthlyEMI; // add back interest for EBITDA
  const annualizedEBITDA=monthlyEBITDA*12;
  const ratingMult=S.rating>=4.0?1.3:S.rating>=3.5?1.1:S.rating>=3.0?1.0:0.7;
  const brandMult=S.brandScore>=60?1.3:S.brandScore>=40?1.1:S.brandScore>=20?1.0:0.7;
  const outletsMult=S.totalOutlets>=3?1.5:S.totalOutlets>=2?1.3:1.0;
  const growthTraj=S.history.length>=3&&S.history[S.history.length-1].revenue>S.history[S.history.length-3].revenue*1.05?1.3:1.0;
  const ebitdaMultiple=annualizedEBITDA>0?10:6;
  const valuation=Math.max(2000000,Math.round(annualizedEBITDA*ebitdaMultiple*ratingMult*brandMult*outletsMult*growthTraj));

  ROUNDS[12]._valuation=valuation;
  ROUNDS[12]._ebitda=annualizedEBITDA;
  ROUNDS[12]._multiple=ebitdaMultiple;

  const decision=getDecision(0);
  S.decisions[12]=`Series A: ${decision}`;

  const items=[];
  if(decision==='accept20'){
    const amt=Math.round(valuation*0.20);S.cash+=amt;S.seriesAAmount=amt;S.equityGiven+=20;
    items.push({text:`Accepted: ${fmt(amt)} for 20% equity! Valuation: ${fmt(valuation)}`,positive:true});
  } else if(decision==='negotiate15'){
    if(S.brandScore>50&&S.rating>3.5){
      const amt=Math.round(valuation*0.15);S.cash+=amt;S.seriesAAmount=amt;S.equityGiven+=15;
      items.push({text:`Negotiation successful! ${fmt(amt)} for 15% equity!`,positive:true});
    } else {
      items.push({text:'Investors walked away. Metrics didn\'t justify the ask.',positive:false});
    }
  } else {
    items.push({text:'Declined. 100% ownership retained. Bootstrapping ahead.',positive:true});
    items.push({text:'Respect from investors, but growth will be slower.',neutral:true});
  }
  items.push({text:`EBITDA: ${fmt(annualizedEBITDA)}/year × ${ebitdaMultiple}x multiple = ${fmt(valuation)} valuation`,neutral:true});

  return {title:'Month 12 — Series A Pitch',items,breakdown:null};
}

// Post-Series A rounds
function processRound13(){
  const city1=getDecision(0),city2=getDecision(1);
  const budget1=getLever('city1_budget');
  const budget2=getLever('city2_budget');

  S.cities=[city1,city2];
  S.cash-=(budget1+budget2);
  S.totalOutlets+=2; // 1 per city minimum

  const cityNames={mumbai:'Mumbai',delhi:'Delhi NCR',hyderabad:'Hyderabad',chennai:'Chennai',pune:'Pune'};
  S.cityData[city1]={budget:budget1,revenue:budget1*0.08,performing:true};
  S.cityData[city2]={budget:budget2,revenue:budget2*0.06,performing:Math.random()>0.3};

  // Add city revenue
  S.monthlyRevenue+=(S.cityData[city1].revenue+S.cityData[city2].revenue);
  simulateMonth();

  S.decisions[13]=`Cities: ${cityNames[city1]}, ${cityNames[city2]}. Budget: ${fmt(budget1)}+${fmt(budget2)}`;

  return {
    title:'Month 13 — Going Multi-City',
    items:[
      {text:`Entered ${cityNames[city1]} (${fmt(budget1)}) and ${cityNames[city2]} (${fmt(budget2)})`,positive:true},
      {text:`Total outlets: ${S.totalOutlets} across ${S.cities.length+1} cities`,neutral:true},
      {text:`New city revenue starting to trickle in. Break-even in 3-6 months.`,neutral:true},
    ],
    breakdown:buildPL()
  };
}

function processRound14(){
  const model=getDecision(0);
  S.operatingModel=model;

  if(model==='franchise'){S.totalOutlets+=4;S.monthlyRevenue+=S.monthlyRevenue*0.06;S.brandScore=clamp(S.brandScore-5,0,100);}
  else if(model==='foco'){S.totalOutlets+=2;S.cash-=1200000;S.monthlyRevenue+=S.monthlyRevenue*0.15;}
  else{S.totalOutlets+=1;S.cash-=2000000;S.monthlyRevenue+=S.monthlyRevenue*0.20;}

  simulateMonth();
  S.decisions[14]=`Model: ${model}`;

  const modelNames={franchise:'Franchise (royalty)',foco:'FOCO',companyowned:'Company-Owned'};
  return {
    title:'Month 14 — Operating Model',
    items:[
      {text:`Model: ${modelNames[model]}${model==='franchise'?' — Fast scale, less control. +4 outlets, 6% royalty.':model==='foco'?' — Balanced. +2 outlets, ₹12L invested.':' — Full control. +1 outlet, ₹20L invested.'}`,neutral:true},
      {text:`Total outlets: ${S.totalOutlets}`,positive:S.totalOutlets>=5},
    ],
    breakdown:buildPL()
  };
}

function processRound15(){
  const loc1=getDecision(0),loc2=getDecision(1);

  if(loc1==='close'){S.cash-=500000;S.totalOutlets=Math.max(1,S.totalOutlets-1);}
  else if(loc1==='pivot'){S.cash-=200000;S.rating=clamp(S.rating+0.1,1,5);}
  else{S.cash-=100000;}

  if(loc2==='close'){S.cash-=500000;S.totalOutlets=Math.max(1,S.totalOutlets-1);}
  else if(loc2==='cloudswitch'){S.cash-=150000;S.deliveryOrders+=30;}
  else{S.cash-=50000;}

  simulateMonth();
  S.decisions[15]=`Location1: ${loc1}, Location2: ${loc2}`;

  return {
    title:'Month 15 — Underperforming Outlets',
    items:[
      {text:'2 locations bleeding money. Taste mismatch + rent dispute.',positive:false},
      {text:`Outlet A: ${loc1==='close'?'Closed (₹5L exit cost)':loc1==='pivot'?'Menu pivoted (₹2L)':'Discount blitz (₹1L)'}`,neutral:true},
      {text:`Outlet B: ${loc2==='close'?'Closed (₹5L exit cost)':loc2==='cloudswitch'?'Switched to cloud kitchen (₹1.5L)':'Rent renegotiated (₹50K legal)'}`,neutral:true},
      {text:`Total outlets: ${S.totalOutlets}`,neutral:true},
    ],
    breakdown:buildPL()
  };
}

function processRound16(){
  const monthlyEBITDA=S.monthlyProfit+S.monthlyEMI;
  const annualizedEBITDA=monthlyEBITDA*12;
  const multiple=S.totalOutlets>=8?15:S.totalOutlets>=5?12:10;
  const valuation=Math.max(5000000,Math.round(annualizedEBITDA*multiple*(S.totalOutlets>=5?1.5:1.0)*(S.brandScore>=50?1.3:1.0)));

  ROUNDS[16]._valuation=valuation;
  const decision=getDecision(0);

  if(decision==='accept'){
    const amt=Math.round(valuation*0.12);S.cash+=amt;S.seriesBAmount=amt;S.equityGiven+=12;
  }

  S.decisions[16]=`Series B: ${decision}`;

  return {
    title:'Month 16 — Series B',
    items:[
      {text:`Valuation: ${fmt(valuation)} (${multiple}x EBITDA)`,neutral:true},
      {text:decision==='accept'?`Raised ${fmt(Math.round(valuation*0.12))} for 12% equity!`:'Declined Series B. Growing on revenue.',positive:decision==='accept'},
    ],
    breakdown:null
  };
}

function processRound17(){
  const response=getDecision(0);

  S.brandScore=clamp(S.brandScore-30,0,100);

  if(response==='fullrecall'){S.cash-=5000000;S.brandScore=clamp(S.brandScore+20,0,100);S.rating=clamp(S.rating-0.3,1,5);}
  else if(response==='targeted'){S.cash-=2500000;S.rating=clamp(S.rating-0.5,1,5);}
  else{S.cash-=500000;S.rating=clamp(S.rating-1.0,1,5);S.brandScore=clamp(S.brandScore-20,0,100);}

  if(S.hasSOPs) S.brandScore=clamp(S.brandScore+10,0,100);

  simulateMonth();
  S.decisions[17]=`Response: ${response}`;

  return {
    title:'Month 17 — Food Safety Crisis',
    items:[
      {text:'Food poisoning at one outlet. 12 hospitalized. Media coverage.',positive:false},
      {text:`Response: ${response==='fullrecall'?'Full audit + recall (₹50L) — thorough but expensive':response==='targeted'?'Targeted response (₹25L) — moderate':' PR campaign only (₹5L) — risky'}`,positive:response==='fullrecall'},
      {text:S.hasSOPs?'Your SOPs helped contain the damage. Brand +10.':'No SOPs — damage harder to contain.',positive:S.hasSOPs},
    ],
    breakdown:buildPL()
  };
}

function processRound18(){
  const exit=getDecision(0);
  S.decisions[18]=`Exit: ${exit}`;

  const monthlyEBITDA=S.monthlyProfit+S.monthlyEMI;
  const multiple=exit==='ipo'?18:exit==='acquisition'?12:10;
  const finalVal=Math.max(5000000,Math.round(monthlyEBITDA*12*multiple*(S.totalOutlets/3)*(S.brandScore/50)));
  ROUNDS[18]._finalValuation=finalVal;

  const items=[];
  if(exit==='ipo'){items.push({text:`IPO prep begins. Target valuation: ${fmt(finalVal)}. 3-year roadmap.`,positive:finalVal>50000000});}
  else if(exit==='acquisition'){
    const acquiAmt=Math.round(finalVal*0.7);S.cash+=acquiAmt;
    items.push({text:`Acquired by Rebel Foods for ${fmt(acquiAmt)}!`,positive:true});
  }
  else if(exit==='private'){items.push({text:`Staying private. Building at your own pace. Valuation: ${fmt(finalVal)}`,positive:true});}
  else{
    const sellAmt=Math.round(finalVal*0.6);S.cash+=sellAmt;
    items.push({text:`Sold majority stake for ${fmt(sellAmt)}. Starting fresh with lessons learned.`,positive:true});
  }

  return {title:'Month 18 — The Exit',items,breakdown:null};
}

        {id:'hold',letter:'C',title:'Hold Prices',desc:'Maintain positioning. Ride it out.'},
      ]},
      {label:'Cost Cutting',options:[
        {id:'layoff',letter:'A',title:'Lay Off 2 Staff',desc:'Saves money. Morale tanks -20. Capacity -30%.'},
        {id:'cutmarketing',letter:'B',title:'Cut Marketing 50%',desc:'Saves money. Brand -5.'},
        {id:'renegotiaterent',letter:'C',title:'Renegotiate Rent',desc:'50% chance of 15% reduction.'},
        {id:'nocuts',letter:'D',title:'No Cuts',desc:'Maintain operations. Hope for recovery.'},
      ]},
      {label:'Pivot',options:[
        {id:'tiffin',letter:'A',title:'Tiffin Service (₹15K)',desc:'Stable ₹30K/mo revenue. New market.'},
        {id:'corporate',letter:'B',title:'Corporate Bulk Orders',desc:'High-value B2B. Variable but lucrative.'},
        {id:'nochange',letter:'C',title:'No Pivot',desc:'Stay the course.'},
      ]},
    ];
  }
  else if(r===12){
    // Will be set in preprocessor
    ROUNDS[12].decisions=[];
  }
  else if(r===13){
    ROUNDS[13].decisions=[
      {label:'City 1',options:[
        {id:'mumbai',letter:'A',title:'Mumbai',desc:'Huge market. High rent (₹2L+). Fierce competition.'},
        {id:'delhi',letter:'B',title:'Delhi NCR',desc:'Massive population. North Indian preference. Good delivery infra.'},
        {id:'hyderabad',letter:'C',title:'Hyderabad',desc:'Biryani capital. Tech crowd. Moderate rents.'},
        {id:'pune',letter:'D',title:'Pune',desc:'College city. Budget-friendly crowd. Lower setup cost.'},
      ]},
      {label:'City 2',options:[
        {id:'chennai',letter:'A',title:'Chennai',desc:'South Indian heartland. Strong filter coffee culture.'},
        {id:'mumbai2',letter:'B',title:'Mumbai',desc:'If not chosen above. Massive delivery market.'},
        {id:'delhi2',letter:'C',title:'Delhi NCR',desc:'If not chosen above.'},
        {id:'hyderabad2',letter:'D',title:'Hyderabad',desc:'If not chosen above.'},
      ]},
    ];
    ROUNDS[13].levers=[
      {id:'city1_budget',label:'City 1 Budget',min:500000,max:2500000,step:100000,default:1000000,format:'currency',hints:[
        {at:500000,text:'Minimal — cloud kitchen only. Low risk, slow start.'},
        {at:1000000,text:'Standard — 1 outlet + marketing. Solid start.'},
        {at:1500000,text:'Strong entry — prime location + launch campaign.'},
        {at:2000000,text:'Premium launch — flagship outlet + aggressive marketing.'},
      ]},
      {id:'city2_budget',label:'City 2 Budget',min:500000,max:2500000,step:100000,default:800000,format:'currency',hints:[
        {at:500000,text:'Lean start — test the market before committing.'},
        {at:1000000,text:'Standard entry — balanced investment.'},
        {at:1500000,text:'Strong push — multiple outlets planned.'},
        {at:2000000,text:'All-in — dominate from day 1.'},
      ]},
    ];
  }
  else if(r===14){
    ROUNDS[14].decisions=[{label:'Operating Model',options:[
      {id:'franchise',letter:'A',title:'Franchise Model',desc:'Fast scaling via franchisees. 6% royalty revenue. Less quality control. +4 outlets.',tag:{text:'Fastest growth',cls:'good'}},
      {id:'foco',letter:'B',title:'FOCO (Franchise-Owned, Company-Operated)',desc:'Partners own, you operate. ₹12L investment. +2 outlets. Balanced.'},
      {id:'companyowned',letter:'C',title:'Company-Owned',desc:'Full control. ₹20L per outlet. +1 outlet. Highest quality.',tag:{text:'Most expensive',cls:'warn'}},
    ]}];
  }
  else if(r===15){
    ROUNDS[15].decisions=[
      {label:'Underperforming Outlet A (taste mismatch)',options:[
        {id:'close',letter:'A',title:'Close It (₹5L exit cost)',desc:'Cut losses. Staff severance + lease penalty.'},
        {id:'pivot',letter:'B',title:'Pivot Menu (₹2L)',desc:'Adapt to local taste. Rating +0.1 if successful.'},
        {id:'discount',letter:'C',title:'Aggressive Discounts (₹1L)',desc:'Build footfall, hope for turnaround.'},
      ]},
      {label:'Underperforming Outlet B (rent dispute)',options:[
        {id:'close',letter:'A',title:'Close It (₹5L exit cost)',desc:'Walk away from the lease dispute.'},
        {id:'cloudswitch',letter:'B',title:'Switch to Cloud Kitchen (₹1.5L)',desc:'Reduce rent, keep delivery revenue.'},
        {id:'renegotiate',letter:'C',title:'Legal Renegotiation (₹50K)',desc:'Fight for better terms.'},
      ]},
    ];
  }
  else if(r===16){
    const monthlyEBITDA=S.monthlyProfit+S.monthlyEMI;
    const annualizedEBITDA=monthlyEBITDA*12;
    const multiple=S.totalOutlets>=8?15:S.totalOutlets>=5?12:10;
    const valuation=Math.max(5000000,Math.round(annualizedEBITDA*multiple*(S.totalOutlets>=5?1.5:1.0)*(S.brandScore>=50?1.3:1.0)));
    ROUNDS[16].decisions=[{label:`Valuation: ${fmt(valuation)} (${multiple}x EBITDA)`,options:[
      {id:'accept',letter:'A',title:`Accept: ${fmt(Math.round(valuation*0.12))} for 12%`,desc:'Fuel the next phase of growth.'},
      {id:'negotiate',letter:'B',title:'Negotiate Better Terms',desc:'Push for 8% equity. Risky.'},
      {id:'decline',letter:'C',title:'Decline — Grow on Revenue',desc:'No dilution. Slower but fully yours.'},
    ]}];
  }
  else if(r===17){
    ROUNDS[17].decisions=[{label:'Crisis Response',options:[
      {id:'fullrecall',letter:'A',title:'Full Audit + Recall (₹50L)',desc:'Audit every outlet. Recall affected batches. Most expensive but thorough.',tag:{text:'Brand recovery',cls:'good'}},
      {id:'targeted',letter:'B',title:'Targeted Response (₹25L)',desc:'Only address affected outlet. Moderate approach.'},
      {id:'pronly',letter:'C',title:'PR Campaign Only (₹5L)',desc:'Spin it. Cheapest but rating will tank.',tag:{text:'⚠️ High risk',cls:'bad'}},
    ]}];
  }
  else if(r===18){
    ROUNDS[18].decisions=[{label:'Exit Strategy',options:[
      {id:'ipo',letter:'A',title:'Prepare for IPO',desc:'3-year roadmap to public listing. Highest potential valuation.'},
      {id:'acquisition',letter:'B',title:'Strategic Acquisition',desc:'Sell to Rebel Foods/Jubilant. 70% of valuation. Immediate liquidity.'},
      {id:'private',letter:'C',title:'Stay Private',desc:'Keep building. Full control. Your timeline.'},
      {id:'sellstart',letter:'D',title:'Sell & Start New',desc:'60% of valuation. Use learnings for venture #2.'},
    ]}];
  }
}

function showRound(){
  S.phase='decision';
  const r=S.round;
  $strip.style.width=((r-1)/TOTAL_ROUNDS*100)+'%';
  $badge.textContent='MONTH '+r+'/'+TOTAL_ROUNDS;
  $rlabel.textContent=ROUNDS[r].title;

  // Update runway badge
  if(r>1){
    calcUnitEconomics();
    $runway.style.display='inline-block';
    if(S.burnRate>0){
      $runway.textContent=S.runwayMonths+'mo runway';
      $runway.className='runway-badge '+(S.runwayMonths>12?'runway-safe':S.runwayMonths>6?'runway-warn':'runway-danger');
    } else {
      $runway.textContent='Profitable ✓';
      $runway.className='runway-badge runway-safe';
    }
  }

  // Dynamic setup
  if(r===9){/* processRound9 sets decisions dynamically */}
  setupRoundDecisions(r);

  const rd=ROUNDS[r];
  let h=renderRoundRail()+renderMetrics();
  if(r>1) h+=renderUnitEconomics();

  // Season banner
  h+=renderSeason();

  // Shock banner
  if(rd.isShock) h+=`<div class="event-banner shock"><div class="ev-icon">⚠️</div><div class="ev-text"><strong>SHOCK EVENT — Month ${r}</strong><br>${rd.narrative||''}</div></div>`;

  // Scene card
  h+=getRoundScene(r);

  // Scenario card with decisions
  h+=`<div class="scenario-card"><span class="tag tag-${rd.isShock?'shock':r===12||r===16?'funding':'decision'}">${rd.isShock?'Shock':r===12||r===16?'Funding':'Month '+r}</span><h2>${rd.title}</h2>`;
  if(rd.narrative&&!rd.isShock) h+=`<p>${rd.narrative}</p>`;

  // Render levers
  if(rd.levers){for(const lev of rd.levers) h+=leverHTML(lev);}

  // Render MCQ decisions
  if(rd.decisions){for(let i=0;i<rd.decisions.length;i++) h+=optionCardsHTML(rd.decisions[i],i);}

  h+='</div>';

  // Journal
  h+=renderJournal();

  // Submit
  const autoEnable=!rd.decisions||rd.decisions.length===0;
  h+=`<div class="nav-row"><button class="btn btn-primary" id="submitBtn" ${autoEnable?'':'disabled'} onclick="window.submitDecisions()">Submit Decisions</button></div>`;

  $main.innerHTML=h;
  $main.scrollTo({top:0});window.scrollTo({top:0,behavior:'smooth'});
}

function showOutcome(outcomeData){
  S.phase='outcome';
  const r=S.round;
  let h=renderRoundRail()+renderMetrics();
  if(r>1) h+=renderUnitEconomics();

  // Insight
  h+=renderInsight();

  // Reviews
  if(r>=2) h+=renderReviews();

  // Outcome
  const isPos=S.monthlyProfit>=0;
  h+=`<div class="outcome-section${isPos?'':' negative'}"><h3>${outcomeData.title}</h3><ul class="outcome-list">`;
  for(const item of outcomeData.items){
    const icon=item.positive?'✅':(item.neutral?'ℹ️':'⚠️');
    h+=`<li><span class="ol-icon">${icon}</span><span>${item.text}</span></li>`;
  }
  h+='</ul></div>';

  // P&L
  if(outcomeData.breakdown){
    h+=`<div class="scenario-card"><span class="tag tag-info">Financial Summary</span><h2>Month ${r} P&L</h2>`;
    h+=`<table class="cost-table"><thead><tr><th>Item</th><th>Amount</th></tr></thead><tbody>`;
    for(const row of outcomeData.breakdown){
      const cls=row.total?' class="total"':row.gst?' class="gst"':'';
      h+=`<tr${cls}><td>${row.label}</td><td style="color:${row.negative?'var(--loss)':row.total?'var(--ink)':'var(--neem)'}">${row.value}</td></tr>`;
    }
    h+='</tbody></table></div>';
  }

  // Bankruptcy check
  if(S.cash<0){
    h+=`<div class="event-banner shock"><div class="ev-icon">🚨</div><div class="ev-text"><strong>CASH NEGATIVE!</strong> You have ${fmtFull(S.cash)}. You need to find revenue or cut costs immediately, or DesiEats shuts down.</div></div>`;
  }

  const isLast=r>=TOTAL_ROUNDS;
  h+=`<div class="nav-row"><button class="btn btn-primary" onclick="window.nextRound()">${isLast?'View Final Results':'Next Month →'}</button></div>`;

  $main.innerHTML=h;
  window.scrollTo({top:0,behavior:'smooth'});
}

function showGameOver(){
  $main.innerHTML=`<div class="gameover-screen">
    <div style="font-size:3rem;margin-bottom:16px">💸</div>
    <h1>DesiEats Ran Out of Cash</h1>
    <p style="color:var(--muted);margin:16px 0;max-width:500px;margin-left:auto;margin-right:auto">You ran out of money in Month ${S.round}. In the real world, this means closing doors, letting go of staff, and losing your deposit. But the lessons you learned are worth more than any MBA textbook.</p>
    <div class="scenario-card" style="text-align:left;max-width:500px;margin:20px auto">
      <h3>What went wrong?</h3>
      <ul style="margin-top:10px;padding-left:20px;font-size:0.88rem;line-height:1.8">
        <li>Final cash: <strong style="color:var(--loss)">${fmtFull(S.cash)}</strong></li>
        <li>Setup cost may have been too high for your funding</li>
        <li>Monthly burn exceeded revenue</li>
        <li>Total revenue earned: ${fmt(S.totalRevenue)}</li>
        <li>Total profit: ${fmt(S.totalProfit)}</li>
      </ul>
    </div>
    <div class="nav-row" style="justify-content:center;gap:12px">
      <button class="btn btn-primary" onclick="window.location.reload()">Try Again</button>
      <a href="index.html" class="btn btn-secondary" style="text-decoration:none">Back to Hub</a>
    </div>
  </div>`;
}

function showResults(){
  S.phase='results';
  $strip.style.width='100%';$badge.textContent='COMPLETE';$rlabel.textContent='Results';

  const finalVal=ROUNDS[18]._finalValuation||ROUNDS[12]._valuation||0;

  let profileTitle,profileDesc;
  if(finalVal>50000000){profileTitle='The Unicorn Builder';profileDesc='VCs are fighting to get in. You built something remarkable.';}
  else if(finalVal>20000000){profileTitle='The Growth Machine';profileDesc='Strong fundamentals, clear trajectory. Your QSR chain is real.';}
  else if(finalVal>10000000){profileTitle='The Bootstrapper';profileDesc='Profitable and sustainable. You proved it works.';}
  else if(finalVal>5000000){profileTitle='The Survivor';profileDesc='Tough market, but you\'re still standing.';}
  else{profileTitle='The Lesson Learner';profileDesc='The education was worth more than any MBA.';}

  let h='<div class="results-screen">';
  h+=`<div class="results-hero"><div class="valuation-label">Final Valuation</div><div class="valuation-number">${fmt(finalVal)}</div><div class="profile-title">"${profileTitle}"</div><div class="profile-desc">${profileDesc}</div></div>`;

  h+='<div class="stats-grid">';
  const stats=[
    {label:'Total Revenue',value:fmt(S.totalRevenue)},{label:'Total Profit',value:fmt(S.totalProfit)},
    {label:'Final Cash',value:fmtFull(S.cash)},{label:'Peak Revenue/mo',value:fmt(S.peakRevenue)},
    {label:'Rating',value:S.rating.toFixed(1)+'/5'},{label:'Brand Score',value:S.brandScore+'/100'},
    {label:'Total Outlets',value:S.totalOutlets.toString()},{label:'Equity Retained',value:(100-S.equityGiven)+'%'},
    {label:'GST Paid',value:fmt(S.totalGST)},{label:'Staff Morale',value:S.staffMorale+'/100'},
  ];
  for(const s of stats) h+=`<div class="stat-card"><div class="sc-label">${s.label}</div><div class="sc-value">${s.value}</div></div>`;
  h+='</div>';

  // Takeaways
  h+='<div class="scenario-card"><span class="tag tag-outcome">Key Takeaways</span><h2>What You Learned</h2>';
  const takeaways=[
    'Unit economics are everything — revenue means nothing if contribution margin is negative.',
    'Cash is oxygen — track your burn rate and runway obsessively.',
    'People are your business — training and fair pay compound into quality and retention.',
    'Shocks are inevitable — the response matters more than the event.',
    'Brand compounds — every quality decision adds to (or subtracts from) your brand equity.',
    'Growth without systems is chaos — SOPs and central kitchens scale; gut feelings don\'t.',
    'GST, compliance, and regulations are real costs — build them into your pricing from day 1.',
    'Valuation follows EBITDA — investors want profitable growth, not just revenue.',
  ];
  for(let i=0;i<takeaways.length;i++) h+=`<div class="takeaway-card"><span class="tw-num">${i+1}</span><span class="tw-text">${takeaways[i]}</span></div>`;
  h+='</div>';

  // Round review
  h+='<div class="scenario-card"><span class="tag tag-info">Round-by-Round</span><h2>Your Journey</h2>';
  const shockRounds=[5,6,8,9,10,11,15,17];
  for(let i=0;i<S.history.length;i++){
    const hist=S.history[i];
    const rn=i+1;
    const isShock=shockRounds.includes(rn);
    h+=`<button class="review-toggle" onclick="toggleReview(this)" data-round="${rn}"><span>${isShock?'⚠️ ':''}Month ${rn}: ${ROUNDS[rn].title}</span><span class="arrow">▶</span></button>
    <div class="review-panel" data-round="${rn}"><p><strong>Decisions:</strong> ${S.decisions[rn]||'N/A'}</p>
    <p><strong>Revenue:</strong> ${fmt(hist.revenue)} | <strong>Profit:</strong> ${fmt(hist.profit)} | <strong>Cash:</strong> ${fmtFull(hist.cash)}</p>
    <p><strong>Rating:</strong> ${hist.rating.toFixed(1)} | <strong>Brand:</strong> ${hist.brand} | <strong>Morale:</strong> ${hist.morale} | <strong>Customers:</strong> ${hist.customers}</p>
    ${S.journal[rn]?'<p><strong>Your Notes:</strong> <em>'+S.journal[rn]+'</em></p>':''}</div>`;
  }
  h+='</div>';

  h+=`<div class="nav-row" style="justify-content:center;gap:12px"><button class="btn btn-secondary" onclick="window.location.reload()">Play Again</button><a href="index.html" class="btn btn-primary" style="text-decoration:none">Back to Hub</a></div>`;
  h+='</div>';
  $main.innerHTML=h;window.scrollTo({top:0,behavior:'smooth'});
}

window.toggleReview=function(btn){
  const r=btn.dataset.round;
  const panel=document.querySelector(`.review-panel[data-round="${r}"]`);
  btn.classList.toggle('open');panel.classList.toggle('open');
};

/* ========== GAME FLOW ========== */
window.startGame=function(){
  resetState();
  S.round=1;
  showRound();
};

window.submitDecisions=function(){
  saveMetrics();

  // Save journal entry
  const journalEl=document.getElementById('journalInput');
  if(journalEl&&journalEl.value.trim()) S.journal[S.round]=journalEl.value.trim();

  const processors={
    1:processRound1,2:processRound2,3:processRound3,4:processRound4,
    5:processRound5,6:processRound6,7:processRound7,8:processRound8,
    9:processRound9,10:processRound10,11:processRound11,12:processRound12,
    13:processRound13,14:processRound14,15:processRound15,16:processRound16,
    17:processRound17,18:processRound18,
  };

  const outcome=processors[S.round]();

  S.history.push({
    round:S.round,revenue:S.monthlyRevenue,profit:S.monthlyProfit,cash:S.cash,
    rating:S.rating,brand:S.brandScore,morale:S.staffMorale,customers:Math.round(S.dailyCustomers),
  });

  // Bankruptcy check — only after round 3 (give time to get started)
  if(S.cash<-500000&&S.round>=3){
    showGameOver();
    return;
  }

  showOutcome(outcome);
};

window.nextRound=function(){
  if(S.round>=TOTAL_ROUNDS){showResults();return;}
  S.round++;
  showRound();
};

/* ========== INIT ========== */
showIntro();

})();
</script>
