        <div class="role-grid">
          <div class="role-card"><div class="role-emoji">📊</div><div class="role-name">Sales Budget</div><div class="role-type">Volume & Price</div></div>
          <div class="role-card"><div class="role-emoji">🏭</div><div class="role-name">Production</div><div class="role-type">Inventory & Labour</div></div>
          <div class="role-card"><div class="role-emoji">📋</div><div class="role-name">Standards</div><div class="role-type">Cost Card</div></div>
          <div class="role-card"><div class="role-emoji">⚖️</div><div class="role-name">Attribution</div><div class="role-type">Who Owns What</div></div>
        </div>
      </div>
    </div>
    <div style="max-width:660px;margin:0 auto">
      <div class="concept-box" style="text-align:left">
        <div class="cb-header">🎯 Your Mission</div>
        <div class="cb-text">You are the CFO of Zenith Appliances. In each round, use the levers to make real cost accounting decisions — set budgets, define standards, handle crises, and attribute variances. The board will react to your choices. There are no right or wrong answers — only consequences, tradeoffs, and principles.</div>
      </div>
      <div style="text-align:left;margin-bottom:16px;font-size:0.82rem;color:var(--muted)">
        <strong>14 Rounds</strong> · <strong>4 Events</strong> · <strong>Lever-Based Decisions</strong> · Based on Horngren's Cost Accounting
      </div>
      <div id="classroomBanner" style="display:none;margin:12px 0;padding:10px 12px;border-radius:8px;background:var(--neem-light);color:var(--neem);font-size:0.85rem;font-weight:600"></div>
    </div>
    <div class="nav-row" style="justify-content:center">
      <button class="btn btn-primary" onclick="window.startGame()">Enter the War Room →</button>
    </div>
  </div>`;
  try{
    if(window.SimulokClassroom){
      const auth=SimulokClassroom.loadSession();
      const ban=$('classroomBanner');
      if(ban&&auth&&auth.session&&auth.session.sim_id==='zenith'&&auth.role!=='instructor'){
        ban.style.display='block';
        ban.textContent='Classroom session '+auth.session.session_id+' · signed in as '+auth.student_id+' ('+auth.name+'). Rounds will log to the Sheet.';
      }
    }
  }catch(e){}
}

window.startGame=function(){S.round=1;S.phase='playing';S.locked=false;S.totalScore=0;S.maxPossible=0;S.roundScores=[];renderRound();};

function renderRound(){
  const r=ROUNDS[S.round-1];S.locked=false;
  $badge.textContent=r.isEvent?'EVENT '+r.id:'R'+r.id;
  $badge.className='step-badge'+(r.isEvent?' event':'');
  $score.style.display='inline';
  $score.textContent=S.totalScore.toFixed(1)+' / '+S.maxPossible.toFixed(1);
  $strip.style.width=((S.round-1)/TOTAL*100)+'%';

  const phaseLabel={build:'BUILD THE BUDGET',standards:'SET STANDARDS',analysis:'ANALYZE VARIANCES',final:'PERFORMANCE REVIEW'};
  const headerCls=r.isEvent?'event':r.phase==='analysis'?'analysis':r.phase==='final'?'final':'budget';
  const phaseIcon=r.isEvent?'⚡':r.phase==='analysis'?'📊':r.phase==='final'?'⚖️':'🏗️';

  r.levers.forEach(l=>{if(S[l.id]===undefined)S[l.id]=l.default;});

  let html=renderRail();
  html+=`<div class="scene-card"><div class="scene-header ${headerCls}">${phaseIcon} ${r.isEvent?'EXCEPTIONAL EVENT':'Round '+r.id} — ${r.title}</div>
    <div class="scene-body"><div class="st-title">${r.subtitle}</div>
    <div class="st-desc" style="margin-top:4px"><strong>Phase:</strong> ${phaseLabel[r.phase]||''} · <strong>Weight:</strong> ${r.marks} marks</div></div></div>`;

  html+=`<div class="concept-box"><div class="cb-header">📖 ${r.concept.title}</div><div class="cb-text">${r.concept.text}</div>
    ${r.concept.formula?`<div class="cb-formula">${r.concept.formula.replace(/\n/g,'<br>')}</div>`:''}</div>`;

  html+=`<div class="data-pack"><div class="dp-header">📋 Data Pack</div>${r.dataHtml}</div>`;

  html+=`<div class="lever-section"><div class="lever-section-header">🎚️ Your Decisions — Set the Levers</div>`;
  r.levers.forEach(l=>{html+=leverHTML(l);});
  html+=`</div>`;

  const vals={};r.levers.forEach(l=>{vals[l.id]=S[l.id];});
  const metrics=r.computeImpact(vals);
  html+=`<div class="impact-preview"><div class="ip-header">📊 Live Impact Preview</div><div class="ip-grid" id="impactGrid">`;
  metrics.forEach(m=>{html+=`<div class="ip-metric ${m.cls||''}"><div class="ip-label">${m.l}</div><div class="ip-value">${m.v}</div></div>`;});
  html+=`</div></div>`;

  html+=`<div id="responseArea"></div>`;
  html+=`<div class="nav-row">
    <button class="btn btn-primary" id="lockBtn" onclick="window.lockIn()">Lock In & Submit to Board →</button>
    <button class="btn btn-primary" id="nextBtn" style="display:none" onclick="window.nextRound()">Next Round →</button>
  </div>`;

  $main.innerHTML=html;$main.scrollTo(0,0);window.scrollTo(0,0);
}

window.lockIn=function(){
  if(S.locked) return;S.locked=true;
  const r=ROUNDS[S.round-1];
  const vals={};r.levers.forEach(l=>{vals[l.id]=S[l.id];});
  const sc=r.score(vals);const marks=sc/4*r.marks;
  S.totalScore+=marks;S.maxPossible+=r.marks;
  S.roundScores.push({round:S.round,marks:marks,max:r.marks,rubric:sc});
  $score.textContent=S.totalScore.toFixed(1)+' / '+S.maxPossible.toFixed(1);

  zenithClassroomLog(S.round, r.title, marks.toFixed(1), {
    rubric: sc,
    max_marks: r.marks,
    levers: vals,
    running_total: S.totalScore,
    max_possible: S.maxPossible
  });

  document.querySelectorAll('.lever-track').forEach(el=>{el.disabled=true;el.style.opacity='0.6';});
  $('lockBtn').style.display='none';$('nextBtn').style.display='inline';

  const fb=r.feedback(vals,sc);
  const scoreCls=sc>=3?'high':sc>=2?'mid':'low';
  let rh=`<div class="board-response ${fb.cls}"><div class="br-header">${fb.icon} Board: ${fb.title}</div><div class="br-text">${fb.text}</div>
    ${fb.sub?`<div class="br-sub">${fb.sub}</div>`:''}</div>`;
  rh+=`<div class="principle-box"><div class="pb-header">📚 Costing Principle</div><div class="pb-text">${r.principle}</div></div>`;
  rh+=`<div class="score-reveal"><div class="sr-circle ${scoreCls}">${marks.toFixed(1)}/${r.marks}</div>
    <div class="sr-text"><div class="sr-label">Round Score (Quality: ${sc.toFixed(1)}/4)</div>
    <div class="sr-detail">Running total: <strong>${S.totalScore.toFixed(1)}</strong> of ${S.maxPossible.toFixed(1)} possible</div></div></div>`;

  $('responseArea').innerHTML=rh;
  $('responseArea').scrollIntoView({behavior:'smooth',block:'start'});
};

window.nextRound=function(){
  if(S.round>=TOTAL){renderResults();return;}
  S.round++;renderRound();
};

function renderResults(){
  $badge.textContent='RESULTS';$badge.className='step-badge';$strip.style.width='100%';
  const pct=S.maxPossible>0?Math.round(S.totalScore/S.maxPossible*100):0;
  const grade=getGrade();const profile=getProfile();

  try{
    if(window.SimulokClassroom&&SimulokClassroom.configured()&&SimulokClassroom.isClassroomStudent()){
      SimulokClassroom.completeRun({
        sim_id:'zenith',
        total:pct,
        grade:grade.letter||'',
        label:profile.name||'',
        profileName:profile.name||'',
        profileBlurb:profile.desc||'',
        display:{ score:Number(S.totalScore.toFixed(1)), max:Number(S.maxPossible.toFixed(1)), pct:pct },
        highlights:[
          'Total '+S.totalScore.toFixed(1)+' / '+S.maxPossible.toFixed(1),
          'Budgeted GP ₹81.84 Cr',
          'Actual GP ₹62.38 Cr'
        ]
      });
    }
  }catch(err){ console.warn('zenith complete', err); }

  const wfData=[
    {label:'Budget GP',val:81.84,type:'base'},{label:'Sales Vol',val:-8.18,type:'neg'},
    {label:'Sales Price',val:4.75,type:'pos'},{label:'Mat Price',val:-6.35,type:'neg'},
    {label:'Mat Usage',val:-4.54,type:'neg'},{label:'Lab Rate',val:-1.40,type:'neg'},
    {label:'Lab Eff',val:-0.48,type:'neg'},{label:'VOH Spend',val:-0.77,type:'neg'},
    {label:'VOH Eff',val:-0.30,type:'neg'},{label:'FOH Spend',val:-0.68,type:'neg'},
    {label:'FOH Vol',val:-1.51,type:'neg'},{label:'Actual GP',val:62.38,type:'total'}
  ];
  const maxVal=Math.max(...wfData.map(d=>Math.abs(d.val)));
  let wfBars='';wfData.forEach(d=>{
    const h=Math.abs(d.val)/maxVal*170;const cls=d.type==='base'?'base':d.type==='total'?'total':d.val>=0?'pos':'neg';
    const sign=d.val>0?'+':'';const label=d.type==='base'||d.type==='total'?'₹'+d.val+' Cr':sign+d.val;
    wfBars+=`<div class="wf-bar-wrap"><div class="wf-bar ${cls}" style="height:${h}px"></div><div class="wf-val">${label}</div><div class="wf-label">${d.label}</div></div>`;
  });

  let roundRows='';S.roundScores.forEach(rs=>{
    const r=ROUNDS[rs.round-1];const cls=rs.rubric>=3?'color:var(--neem)':rs.rubric>=2?'color:var(--saffron)':'color:var(--loss)';
    roundRows+=`<tr><td>${r.isEvent?'E':'R'}${r.id}</td><td>${r.title}</td><td style="font-family:ui-monospace,monospace;${cls}">${rs.rubric.toFixed(1)}/4</td><td style="font-family:ui-monospace,monospace">${rs.marks.toFixed(1)}/${rs.max}</td></tr>`;
  });

  const attribData=[
    {v:'Material usage ₹4.54 Cr U',c:'Cost Centre (Plant Head)',ctrl:'Yes',s:'Inefficiency'},
    {v:'Labour efficiency ₹0.48 Cr U',c:'Cost Centre',ctrl:'Yes',s:'Post-fire relearning'},
    {v:'VOH spending ₹0.77 Cr U',c:'Cost Centre',ctrl:'Yes',s:'Operations'},
    {v:'VOH efficiency ₹0.30 Cr U',c:'Cost Centre',ctrl:'Yes',s:'Operations'},
    {v:'Sales price ₹4.75 Cr F',c:'Revenue Centre',ctrl:'Yes',s:'Achievement'},
    {v:'Material price ₹2.10 Cr U',c:'Procurement',ctrl:'Partly',s:'Hedge failure'},
    {v:'Sales volume ₹8.18 Cr U',c:'Exceptional',ctrl:'No',s:'Fire'},
    {v:'Material price ₹4.25 Cr U',c:'Exceptional',ctrl:'No',s:'Currency'},
    {v:'Labour rate ₹1.40 Cr U',c:'Exceptional',ctrl:'No',s:'Statutory'},
    {v:'FOH volume ₹1.51 Cr U',c:'Exceptional',ctrl:'No',s:'Fire'},
    {v:'FOH spending ₹0.37 Cr U',c:'Exceptional',ctrl:'No',s:'Fire repair'}
  ];
  let attRows='';attribData.forEach(a=>{
    const cc=a.ctrl==='Yes'?'color:var(--neem)':a.ctrl==='No'?'color:var(--loss)':'color:var(--saffron)';
    attRows+=`<tr><td>${a.v}</td><td>${a.c}</td><td style="${cc};font-weight:600">${a.ctrl}</td><td>${a.s}</td></tr>`;
  });

  $main.innerHTML=`
  <div class="results-screen">
    <div class="results-hero" style="border:1.5px solid ${grade.color}">
      <div style="font-size:0.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:0.08em;margin-bottom:8px">Final Assessment</div>
      <div class="grade-circle" style="border-color:${grade.color};color:${grade.color}"><div class="grade-letter">${pct}%</div></div>
      <div style="font-size:1.4rem;font-weight:700;color:${grade.color};font-family:Georgia,serif">${grade.letter}</div>
      <div style="font-size:1.05rem;font-weight:700;margin-top:16px;font-family:Georgia,serif">Executive Profile: ${profile.name}</div>
      <div style="font-size:0.85rem;color:var(--muted);margin-top:4px;max-width:500px;margin-left:auto;margin-right:auto">${profile.desc}</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="sc-label">Total Score</div><div class="sc-value">${S.totalScore.toFixed(1)} / ${S.maxPossible.toFixed(1)}</div></div>
      <div class="stat-card"><div class="sc-label">Percentage</div><div class="sc-value" style="color:${grade.color}">${pct}%</div></div>
      <div class="stat-card"><div class="sc-label">Rounds</div><div class="sc-value">${TOTAL}</div></div>
      <div class="stat-card"><div class="sc-label">Budgeted GP</div><div class="sc-value">₹81.84 Cr</div></div>
      <div class="stat-card"><div class="sc-label">Actual GP</div><div class="sc-value">₹62.38 Cr</div></div>
      <div class="stat-card"><div class="sc-label">Total Variance</div><div class="sc-value" style="color:var(--loss)">₹19.46 Cr U</div></div>
    </div>

    <div class="waterfall"><div class="wf-header">📊 Variance Waterfall: Budgeted to Actual Gross Profit</div><div class="wf-chart">${wfBars}</div></div>

    <div class="budget-cascade">
      <div class="bc-header">📋 Standard Cost Card (Your Settings)</div>
      <div class="bc-row"><span>Direct material (${(S.stdMatQty||3.85).toFixed(2)} kg × ₹1,050)</span><span class="bc-val">₹${Math.round((S.stdMatQty||3.85)*1050)}</span></div>
      <div class="bc-row"><span>Direct labour (${(S.stdLabHrs||3.35).toFixed(2)} hrs × ₹220)</span><span class="bc-val">₹${Math.round((S.stdLabHrs||3.35)*220)}</span></div>
      <div class="bc-row"><span>Variable OH (${(S.stdLabHrs||3.35).toFixed(2)} hrs × ₹${S.stdVOHRate||135})</span><span class="bc-val">₹${Math.round((S.stdLabHrs||3.35)*(S.stdVOHRate||135))}</span></div>
      <div class="bc-row"><span>Fixed OH (${(S.stdLabHrs||3.35).toFixed(2)} hrs × ₹${Math.round(1404*100000/(S.denomHrs||1050000))})</span><span class="bc-val">₹${Math.round((S.stdLabHrs||3.35)*Math.round(1404*100000/(S.denomHrs||1050000)))}</span></div>
      <div class="bc-row" style="font-weight:700;border-top:2px solid var(--ink);padding-top:8px"><span>Total Standard Cost</span><span class="bc-val">₹${Math.round((S.stdMatQty||3.85)*1050+(S.stdLabHrs||3.35)*220+(S.stdLabHrs||3.35)*(S.stdVOHRate||135)+(S.stdLabHrs||3.35)*Math.round(1404*100000/(S.denomHrs||1050000)))}</span></div>
      <div class="bc-row"><span>Selling price</span><span class="bc-val">₹${fmtN(S.sellPrice||9500)}</span></div>
      <div class="bc-row" style="font-weight:700;color:var(--neem)"><span>Standard Profit per Unit</span><span class="bc-val">₹${fmtN((S.sellPrice||9500)-Math.round((S.stdMatQty||3.85)*1050+(S.stdLabHrs||3.35)*220+(S.stdLabHrs||3.35)*(S.stdVOHRate||135)+(S.stdLabHrs||3.35)*Math.round(1404*100000/(S.denomHrs||1050000))))}</span></div>
    </div>

    <div style="background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;overflow-x:auto">
      <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:10px">⚖️ Defensible Attribution Matrix</div>
      <table class="dp-table"><tr><th>Variance</th><th>Centre</th><th>Ctrl?</th><th>Source</th></tr>${attRows}</table>
      <div style="margin-top:12px;padding:10px;background:var(--input-bg);border-radius:var(--radius-sm);font-size:0.82rem">
        <strong>The uncomfortable conclusion:</strong> Of ₹19.46 Cr total variance, <span style="color:var(--loss);font-weight:700">₹15.71 Cr (81%)</span> was nobody's fault. The largest controllable loss — ₹4.54 Cr of material usage — sat buried in noise until properly attributed.
      </div>
    </div>

    <div style="background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;overflow-x:auto">
      <div style="font-size:0.72rem;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:10px">📝 Round-by-Round Performance</div>
      <table class="dp-table"><tr><th>Round</th><th>Topic</th><th>Quality</th><th>Score</th></tr>${roundRows}</table>
    </div>

    <div class="principle-box">
      <div class="pb-header">📚 Closing Principles</div>
      <div class="pb-text">
        <div class="takeaway-card"><div class="tw-num">1</div><div>Push forward thinking, not just roll forward the past.</div></div>
        <div class="takeaway-card"><div class="tw-num">2</div><div>Focus on doing the right thing first rather than spending energy on doing it right. A wrong thing done right is still wrong.</div></div>
        <div class="takeaway-card"><div class="tw-num">3</div><div>Have clarity and transparency. Do not allow others to fool you, and do not fool yourself.</div></div>
        <div class="takeaway-card"><div class="tw-num">4</div><div>Variance analysis is a journey. Dig deeper, learn from the past, provide direction for the future.</div></div>
        <div class="takeaway-card"><div class="tw-num">5</div><div>The variance system was not the problem. The attribution was.</div></div>
      </div>
    </div>

    <div class="nav-row" style="justify-content:center"><button class="btn btn-secondary" onclick="location.reload()">Play Again</button></div>
    <div style="text-align:center;margin-top:20px;padding:16px;font-size:0.75rem;color:var(--muted)">
      SimuLok — Operating Costing & Budgetary Control<br>Based on Horngren's Cost Accounting · Designed for Executive MBA
    </div>
  </div>`;
  $main.scrollTo(0,0);window.scrollTo(0,0);
}

renderIntro();
})();
